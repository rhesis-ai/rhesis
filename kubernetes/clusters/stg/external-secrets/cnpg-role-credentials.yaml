---
# rhesis-enterprise: owner of the Rhesis Enterprise licensing registry DB. Read by
# the CNPG managed role and by rhesis-ee's gated Jobs in this namespace (license
# issuance, backfill). The registry's own Jobs use the copy in namespace
# rhesis-enterprise (rhesis-enterprise-credentials.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rhesis-enterprise-credentials
  namespace: rhesis
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: rhesis-enterprise-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: rhesis-enterprise
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: stg-rhesis-enterprise-password
