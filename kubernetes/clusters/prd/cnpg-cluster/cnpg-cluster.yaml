# CloudNativePG: HA PostgreSQL for production. Shared roles, parameters and
# bootstrap SQL: kubernetes/base/cnpg-cluster. This patch holds only what differs.
# Operator Application: kubernetes/clusters/prd/cnpg-operator.yaml
# Argo CD Application: kubernetes/clusters/prd/cnpg-cluster-application.yaml (sync-wave 5)
#
# Auth: Workload Identity (gkeEnvironment: true). No JSON key — CNPG pods impersonate
# GSA rhesis-cnpg-bk-prd@rhesis-prd.iam.gserviceaccount.com via the KSA annotation below.
# Terraform module cnpg_barman_prd creates the WI IAM binding.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rhesis-prd
spec:
  description: "Rhesis production PostgreSQL (CloudNativePG)"
  instances: 3
  storage:
    size: 100Gi
  # Annotate the CNPG-managed KSA so GKE Workload Identity links it to the GSA.
  serviceAccountTemplate:
    metadata:
      annotations:
        iam.gke.io/gcp-service-account: rhesis-cnpg-bk-prd@rhesis-prd.iam.gserviceaccount.com
  resources:
    requests:
      memory: 1Gi
      cpu: "1"
    limits:
      memory: 4Gi
      # cpu limit intentionally omitted: databases benefit from absorbing CPU bursts.
      # cpu request above ensures correct scheduler placement and a higher relative
      # CPU share under node contention (raised from 500m — k6 stress testing showed
      # the primary's query latency degrading under concurrent backend HPA scale-out).
  postgresql:
    parameters:
      max_connections: "300"
      # Drop backends whose client pod died without closing its socket (node
      # preemption, OOM). The OS default only probes after 2h of silence.
      tcp_keepalives_idle: "60"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "6"
      # A session left open inside a transaction holds locks and a pool slot.
      idle_in_transaction_session_timeout: "10min"
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: rhesis-prd-db
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: gs://cnpg-backup-rhesis-prd
      serverName: rhesis-prd
