apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - grafana-instance.yaml
  - grafana-ingress.yaml
  - prometheus-datasource.yaml
  - loki-datasource.yaml
  # All pick their Postgres datasource by template variable, so one copy works in every
  # env. The three activity dashboards replace the Looker Studio reports that died with
  # the Cloud Run era Cloud SQL instances.
  - usage-dashboard.yaml
  - user-activity-dashboard.yaml
  - organization-dashboard.yaml
  - test-activity-dashboard.yaml
  # Alerting: identical in every env. Each cluster's ExternalSecret (see
  # clusters/*/grafana-resources/discord-webhook-secret.yaml and
  # grafana-smtp-credentials.yaml) fills in the two things that differ — the Discord
  # webhook URL and the SMTP creds — via secret names local to that cluster's
  # monitoring namespace.
  - basic-alerts-folder.yaml
  - contact-point.yaml
  - notification-policy.yaml
  - basic-alerts.yaml
  - postgres-alerts.yaml

configMapGenerator:
  # Single source for the alert recipient/sender address, since it's the same in
  # every env — read by both grafana-instance.yaml (GF_SMTP_FROM_ADDRESS) and
  # contact-point.yaml (email receiver) so it's defined once, not duplicated.
  - name: grafana-alert-email
    literals:
      - address=hello@rhesis.ai
    options:
      annotations:
        config.kubernetes.io/local-config: "true"
      disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: grafana-alert-email
      fieldPath: data.address
    targets:
      - select:
          kind: Grafana
          name: grafana
        fieldPaths:
          - spec.deployment.spec.template.spec.containers.[name=grafana].env.[name=GF_SMTP_FROM_ADDRESS].value
      - select:
          kind: GrafanaContactPoint
          name: default-notifications
        fieldPaths:
          - spec.receivers.[type=email].settings.addresses
