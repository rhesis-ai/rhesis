# Credentials of the rhesis-enterprise role (owner of the Rhesis Enterprise licensing
# registry DB) for rhesis-ee's registry Jobs in namespace rhesis-enterprise
# (ENTERPRISE_DB_USER/PASS). Same GSM key as the copy in namespace rhesis
# (cnpg-role-credentials.yaml), which the CNPG managed role reads.
# Wave 5, like rhesis-app-secrets.yaml: after the ClusterSecretStore.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rhesis-enterprise-credentials
  namespace: rhesis-enterprise
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: rhesis-enterprise-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: rhesis-enterprise
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prd-rhesis-enterprise-password
