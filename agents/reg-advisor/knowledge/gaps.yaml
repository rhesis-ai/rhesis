    summary: "Provisional Council and Parliament agreement on 7 May 2026 defers Annex I embedded high-risk AI to 2 Aug 2028 and standalone Annex III to 2 Dec 2027. Some secondary sources report formal adoption in mid-2026 with an OJ regulation number, but this could not be independently verified against EUR-Lex. The target dates are consistent across sources; the final regulation citation is UNVERIFIED."
