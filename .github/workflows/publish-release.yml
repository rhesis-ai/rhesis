name: "[Release] 3. Publish"
on:
  workflow_dispatch:  # Allows manual triggering

# Does not deploy prd. Until a k8s prd deploy is wired in here, run
# deploy-all-k8s.yml manually with environment: prd.
jobs:
  publish:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RHEO_APP_ID }}
          private-key: ${{ secrets.RHEO_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Git
        run: |
            git config user.name "rheo-app[bot]"
            git config user.email "237771051+rheo-app[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install uv for SDK
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
            version: latest

      - name: Run publish script
        run: |
          python3 .github/release --publish

        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Close release PR and merge to main
        run: |
          gh pr merge --merge
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
