name: Refresh OWASP Data

on:
  workflow_dispatch:
  schedule:
    # First Monday of each month at 08:00 UTC.
    - cron: "0 8 1-7 * 1"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RHEO_APP_ID }}
          private-key: ${{ secrets.RHEO_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ steps.generate-token.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Re-extract OWASP data
        run: uv run --project sdk scripts/refresh-owasp-data.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet sdk/src/rhesis/sdk/services/data/owasp/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          committer: rheo-app[bot] <237771051+rheo-app[bot]@users.noreply.github.com>
          author: rheo-app[bot] <237771051+rheo-app[bot]@users.noreply.github.com>
          branch: chore/refresh-owasp-data
          commit-message: "chore(sdk): refresh bundled OWASP report data"
          title: "chore(sdk): refresh bundled OWASP report data"
          body: |
            Automated monthly refresh of the pre-extracted OWASP Top 10 JSON
            files shipped with the SDK.

            Triggered by the `refresh-owasp-data` workflow.
          labels: dependencies
          delete-branch: true
