apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd-grafana-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/rhesis-ai/rhesis.git
    targetRevision: 0f5e2d38c482c4572d8b9caa0793c9dfce52d140
    path: kubernetes/clusters/prd/grafana-operator
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
