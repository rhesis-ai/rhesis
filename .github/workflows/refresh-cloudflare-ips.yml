name: Refresh Cloudflare IPs

# Cloudflare's edge ranges are committed under kubernetes/ in every
# `# cloudflare-ips:begin` block (today the ingress-nginx-external real-IP trust
# list), so open a PR whenever Cloudflare publishes a change.
on:
  workflow_dispatch:
  schedule:
    # Mondays at 07:00 UTC.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RHEO_APP_ID }}
          private-key: ${{ secrets.RHEO_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # create-pull-request sets up its own auth from the token below.
          persist-credentials: false

      - name: Sync committed ranges with Cloudflare's list
        run: python3 -I scripts/refresh-cloudflare-ips.py

      # Exits without opening a PR when the script changed nothing.
      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          committer: rheo-app[bot] <237771051+rheo-app[bot]@users.noreply.github.com>
          author: rheo-app[bot] <237771051+rheo-app[bot]@users.noreply.github.com>
          branch: chore/refresh-cloudflare-ips
          commit-message: "chore(dev): refresh Cloudflare edge IP ranges"
          title: "chore(dev): refresh Cloudflare edge IP ranges"
          signoff: true
          body: |
            Cloudflare's published edge ranges (https://api.cloudflare.com/client/v4/ips)
            no longer match the ranges committed under `kubernetes/`.

            Until this merges, requests arriving through the new ranges are logged
            with the Cloudflare edge IP instead of the visitor's.
            prd picks this up at its next release pin, so consider a prd release soon
            after merging.

            Triggered by the `refresh-cloudflare-ips` workflow.
          labels: dependencies
          delete-branch: true
