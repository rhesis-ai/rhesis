apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd-cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rhesis-ai/rhesis.git
    targetRevision: 502c1e4df937b353301c1fdd3529ad5e3ae47485
    path: kubernetes/clusters/prd/cert-manager
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
