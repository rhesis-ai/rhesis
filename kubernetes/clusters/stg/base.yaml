apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stg-base
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rhesis-ai/rhesis.git
    targetRevision: main
    path: kubernetes/clusters/stg
  destination:
    server: https://kubernetes.default.svc
  # The rhesis Application's chart revision is set by the deploy (deploy-all-k8s.yml
  # → k8s-deploy.yml), in the same write as its image tags, so the chart and the
  # images it was released with change together. Without this, selfHeal would put
  # back the targetRevision from git.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: rhesis
      namespace: argocd
      jsonPointers:
        - /spec/source/targetRevision
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - RespectIgnoreDifferences=true
