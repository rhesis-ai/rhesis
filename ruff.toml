
line-length = 100

[lint]
select = [
    "I",
    "E",
    "F",
    # bugbear: legal, typed code that is still a trap — zip() truncation,
    # loop-variable closures, return inside finally.
    "B",
    # create_task() with no stored reference: the loop keeps only a weak reference,
    # so the task can be collected mid-flight and the work silently vanishes.
    "RUF006",
    # Implicit optionals — `db: Session = None` lies to every type checker. Keeping
    # these out is what lets a type checker be introduced file by file.
    "RUF013",
    # noqa directives for violations that no longer happen.
    "RUF100",
]
ignore = [
    # FastAPI puts Depends() in argument defaults by design.
    "B008",
    # Bare `raise` inside except is idiomatic here; we re-raise more than we chain.
    "B904",
]
# Codes suppressed ahead of the rule being switched on. RUF100 treats a noqa for a
# non-enabled rule as unused, so without this it would strip the suppressions that
# each of these rollouts still needs.
external = [
    "ARG002",
    "BLE001",
    "D401",
    "PLC0415",
    "RET503",
    "S608",
    "SLF001",
]

[lint.per-file-ignores]
"__init__.py" = [
    "F401",
]
# Migrations are frozen historical records built around long SQL literals, and
# some need sys.path patched before they can import their helpers.
"**/alembic/versions/*.py" = [
    "E501",
    "E402",
]
# RequestScope is @dataclass(frozen=True), so the shared default instance cannot
# be mutated and cannot leak between requests. B039 is wrong here.
"apps/backend/src/rhesis/backend/app/scope.py" = [
    "B039",
]

[lint.isort]
known-first-party = [
    "rhesis.sdk",
    "rhesis.backend",
    "rhesis.penelope",
    "rhesis.polyphemus",
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
