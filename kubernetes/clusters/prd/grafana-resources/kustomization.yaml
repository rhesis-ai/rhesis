apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/grafana-resources
  # prd-only: reads a physical hot-standby replica and a prd-scoped GSM secret, so this
  # doesn't belong in base/grafana-resources (shared identically by dev/stg/prd).
  - grafana-viewer-credentials.yaml
  - postgres-prd-datasource.yaml
  # prd-scoped Discord webhook URL and SMTP creds; the contact point that consumes
  # them lives in base/grafana-resources (shared identically by dev/stg/prd).
  - discord-webhook-secret.yaml
  - grafana-smtp-credentials.yaml

configMapGenerator:
  - name: grafana-config
    literals:
      - grafana-hostname=grafana.rhesis.ai
      - grafana-root-url=https://grafana.rhesis.ai
    options:
      annotations:
        config.kubernetes.io/local-config: "true"
      disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: grafana-config
      fieldPath: data.grafana-hostname
    targets:
      - select:
          kind: Ingress
          name: grafana-ingress
        fieldPaths:
          - spec.tls.0.hosts.0
          - spec.rules.0.host
  - source:
      kind: ConfigMap
      name: grafana-config
      fieldPath: data.grafana-root-url
    targets:
      - select:
          kind: Grafana
          name: grafana
        fieldPaths:
          - spec.config.server.root_url
