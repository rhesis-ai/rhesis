    responsible_actor: ["manufacturer"]
    evidence_artifacts: ["EU declaration of conformity", "technical documentation", "classification rationale"]
    competent_authority: ["national competent authority"]
    timing: "Before placing on market"
    consequences_of_noncompliance: "Improper CE marking; market withdrawal"
