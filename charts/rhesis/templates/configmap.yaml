apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rhesis.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhesis.labels" . | nindent 4 }}
data:
  # -------------------------------------------------------------------------
  # Database — host/name/user resolved from subchart or externalDatabase
  # -------------------------------------------------------------------------
  DB_HOST: {{ include "rhesis.postgresql.host" . | quote }}
  DB_DRIVER: {{ .Values.config.dbDriver | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  APP_DB_USER: {{ .Values.config.dbUser | quote }}

  # -------------------------------------------------------------------------
  # Redis / Valkey — host resolved from subchart or externalValkey
  # -------------------------------------------------------------------------
  REDIS_HOST: {{ include "rhesis.valkey.host" . | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}

  # -------------------------------------------------------------------------
  # Application
  # -------------------------------------------------------------------------
  FRONTEND_ENV: {{ .Values.config.environment | quote }}
  BACKEND_ENV: {{ .Values.config.environment | quote }}
  WORKER_ENV: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  JSON_LOGGER_ENABLED: {{ .Values.config.jsonLoggerEnabled | quote }}

  # -------------------------------------------------------------------------
  # Frontend
  # -------------------------------------------------------------------------
  API_BASE_URL: {{ .Values.config.apiBaseUrl | quote }}
  NEXT_TELEMETRY_DISABLED: {{ .Values.config.nextTelemetryDisabled | quote }}
  # None of the frontend values below are NEXT_PUBLIC_* on purpose: that prefix
  # bakes a value into the client bundle at build time, which would mean one
  # image per deployment. The frontend reads these per request instead.
  SUPPORT_EMAIL: {{ .Values.config.supportEmail | quote }}
  ONBOARDING_VIDEO_URL: {{ .Values.config.onboardingVideoUrl | quote }}
  ARCHITECT_HELP_ARTICLE_URLS: {{ .Values.config.architectHelpArticleUrls | quote }}
  {{- range $entity, $media := .Values.config.emptyStates }}
  {{- $prefix := $entity | upper | replace "-" "_" }}
  {{- with $media.videoUrl }}
  {{ $prefix }}_EMPTY_STATE_VIDEO_URL: {{ . | quote }}
  {{- end }}
  {{- with $media.articleUrls }}
  {{ $prefix }}_EMPTY_STATE_ARTICLE_URLS: {{ if kindIs "slice" . }}{{ join "," . | quote }}{{ else }}{{ . | quote }}{{ end }}
  {{- end }}
  {{- end }}
  BRAND_PRIMARY_COLOR: {{ .Values.config.brandPrimaryColor | quote }}
  BRAND_SECONDARY_COLOR: {{ .Values.config.brandSecondaryColor | quote }}
  BRAND_FAVICON_URL: {{ .Values.config.brandFaviconUrl | quote }}
  BRAND_PRODUCT_NAME: {{ .Values.config.brandProductName | quote }}
  BRAND_FONT_FAMILY: {{ .Values.config.brandFontFamily | quote }}
  BRAND_FONT_BASE_URL: {{ .Values.config.brandFontBaseUrl | quote }}

  # -------------------------------------------------------------------------
  # Backend
  # -------------------------------------------------------------------------
  RHESIS_BASE_URL: {{ .Values.config.rhesisBaseUrl | quote }}
  FRONTEND_URL: {{ .Values.config.frontendUrl | quote }}
  BACKEND_URL: {{ .Values.config.backendUrl | quote }}
  QUICK_START: {{ .Values.config.quickStart | quote }}
  USAGE_QUOTAS_ENABLED: {{ .Values.config.usageQuotasEnabled | quote }}
  JOB_RETENTION_ENABLED: {{ .Values.config.jobRetentionEnabled | quote }}
  JOB_RETENTION_DAYS: {{ .Values.config.jobRetentionDays | quote }}
  TRACE_RETENTION_ENABLED: {{ .Values.config.traceRetentionEnabled | quote }}
  TRACE_RETENTION_DRY_RUN: {{ .Values.config.traceRetentionDryRun | quote }}
  TRACE_RETENTION_DAYS: {{ .Values.config.traceRetentionDays | quote }}

  # -------------------------------------------------------------------------
  # Auth
  # Disposable-email screening on self-serve sign-up. Config, not a secret, so
  # blocking a domain is a values change plus a rollout — no image rebuild.
  # -------------------------------------------------------------------------
  AUTH_BLOCK_DISPOSABLE_EMAILS: {{ .Values.config.authBlockDisposableEmails | quote }}
  AUTH_DISPOSABLE_EMAIL_EXTRA_DOMAINS: {{ .Values.config.authDisposableEmailExtraDomains | quote }}
  AUTH_DEFAULT_SSO_ORGANIZATION: {{ .Values.config.authDefaultSsoOrganization | quote }}

  # -------------------------------------------------------------------------
  # AI model configuration
  # -------------------------------------------------------------------------
  AZURE_OPENAI_DEPLOYMENT_NAME: {{ .Values.config.azureOpenAiDeploymentName | quote }}
  AZURE_OPENAI_API_VERSION: {{ .Values.config.azureOpenAiApiVersion | quote }}
  OPENAI_MODEL_NAME: {{ .Values.config.openAiModelName | quote }}
  DEFAULT_GENERATION_MODEL: {{ .Values.config.defaultGenerationModel | quote }}
  DEFAULT_EVALUATION_MODEL: {{ .Values.config.defaultEvaluationModel | quote }}
  DEFAULT_EXECUTION_MODEL: {{ .Values.config.defaultExecutionModel | quote }}
  DEFAULT_EMBEDDING_MODEL: {{ .Values.config.defaultEmbeddingModel | quote }}

  # -------------------------------------------------------------------------
  # SMTP
  # -------------------------------------------------------------------------
  SMTP_PORT: {{ .Values.config.smtpPort | quote }}

  # -------------------------------------------------------------------------
  # Celery
  # -------------------------------------------------------------------------
  CELERY_WORKER_CONCURRENCY: {{ .Values.config.celeryWorkerConcurrency | quote }}
  CELERY_ARCHITECT_CONCURRENCY: {{ .Values.config.celeryArchitectConcurrency | quote }}
  CELERY_WORKER_PREFETCH_MULTIPLIER: {{ .Values.config.celeryWorkerPrefetchMultiplier | quote }}
  CELERY_WORKER_MAX_TASKS_PER_CHILD: {{ .Values.config.celeryWorkerMaxTasksPerChild | quote }}
  CELERY_WORKER_LOGLEVEL: {{ .Values.config.celeryWorkerLogLevel | quote }}

  # -------------------------------------------------------------------------
  # GCP / Vertex AI
  # -------------------------------------------------------------------------
  VERTEX_AI_LOCATION: {{ .Values.config.vertexAiLocation | quote }}
  # Embedding models are not served from the us/eu multi-region endpoints, so
  # they need a concrete region even when vertexAiLocation is a multi-region.
  VERTEX_AI_EMBEDDING_LOCATION: {{ .Values.config.vertexAiEmbeddingLocation | quote }}
  VERTEX_AI_PROJECT: {{ .Values.config.vertexAiProject | quote }}

  # -------------------------------------------------------------------------
  # Chatbot
  # -------------------------------------------------------------------------
  CHATBOT_RATE_LIMIT: {{ .Values.config.chatbotRateLimit | quote }}
  CHATBOT_RATE_LIMIT_ALERTS_ENABLED: {{ .Values.config.chatbotRateLimitAlertsEnabled | quote }}
  RHESIS_CONNECTOR_DISABLED: {{ .Values.config.rhesisConnectorDisabled | quote }}
  RHESIS_PROJECT_ID: {{ .Values.config.rhesisProjectId | quote }}

  # -------------------------------------------------------------------------
  # Analytics DB — telemetry-processor (non-sensitive parts)
  # Password / full URL come from rhesis-app-secrets (ANALYTICS_DB_PASS / ANALYTICS_DATABASE_URL).
  # -------------------------------------------------------------------------
  ANALYTICS_DB_HOST: {{ include "rhesis.analyticsDatabase.host" . | quote }}
  ANALYTICS_DB_PORT: {{ include "rhesis.analyticsDatabase.port" . | quote }}
  ANALYTICS_DB_NAME: {{ include "rhesis.analyticsDatabase.name" . | quote }}

  # -------------------------------------------------------------------------
  # OTel Collector / Telemetry Processor
  # -------------------------------------------------------------------------
  OTEL_PROCESSOR_ENDPOINT: {{ .Values.config.otelProcessorEndpoint | quote }}
  OTEL_INSECURE: {{ .Values.config.otelInsecure | quote }}
  OTEL_DEPLOYMENT_TYPE: {{ .Values.config.otelDeploymentType | quote }}
