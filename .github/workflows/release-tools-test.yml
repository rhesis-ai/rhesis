name: "[Test] Release tools"

on:
  push:
    branches: [ main ]
    paths:
      - '.github/release_tools/**'
      - 'tests/release_tools/**'
      - '.github/workflows/release-tools-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/release_tools/**'
      - 'tests/release_tools/**'
      - '.github/workflows/release-tools-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel only on PR branches. Two merges landing close together share one group
  # on main, and cancelling there leaves the earlier commit with no test verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-tools:
    name: Release tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pytest
        # release_tools declares no dependencies, and tests/release_tools/conftest.py
        # puts .github on sys.path the same way `python3 .github/release` does.
        run: pip install pytest

      - name: Run release tool tests
        run: pytest tests/release_tools -v --no-header -p no:cacheprovider
