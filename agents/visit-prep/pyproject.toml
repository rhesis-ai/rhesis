[project]
name = "visit-prep"
version = "0.1.0"
description = "Visit-Prep: a Haystack multi-agent demo for doctor visit preparation"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Engineering Team", email = "engineering@rhesis.ai" },
]
keywords = [
    "llm",
    "ai",
    "agents",
    "multi-agent",
    "health",
    "haystack",
    "telemetry",
    "rhesis",
]
# rhesis-haystack (deepset's upstream integration) is deliberately NOT declared here. Its only
# distribution is a path source outside this repo, which does not resolve from a worktree, and
# `uv lock` locks every extra -- so declaring it at all would break locking for everyone. The
# upstream entry points install it on demand instead:
#   uv pip install -e <path-to>/haystack-core-integrations/integrations/rhesis
dependencies = [
    "rhesis-sdk[haystack]",
    "haystack-ai>=3.0,<4",
    "google-genai-haystack>=4.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.license]
text = "MIT"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visit_prep"]

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { pydantic-settings = false, langsmith = false, litellm = false, aiohttp = false, tornado = false, starlette = false, pyjwt = false, cryptography = false, python-multipart = false, gitpython = false, langchain-classic = false, langchain-core = false, idna = false }
constraint-dependencies = [
    "pyasn1>=0.6.4",
    "orjson>=3.11.7",
    "tornado>=6.5.7",
    "aiohttp>=3.14.1",
    "langchain-openai>=1.1.14",
    "langchain-core>=1.3.3",
    "langchain-classic>=1.0.7",
    "gitpython>=3.1.52",
    "idna>=3.15",
    "starlette>=1.3.1",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "langsmith>=0.8.18",
    "litellm>=1.84.0",
    "pydantic-settings>=2.14.2",
    "setuptools>=83.0.0",
    "langchain>=1.3.9",
    "mcp>=1.28.1",
    "pillow>=12.3.0",
]
override-dependencies = [
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.0",
]

[tool.uv.sources]
rhesis-sdk = { path = "../../sdk", editable = true }
# Pinned explicitly rather than only inherited through rhesis-sdk. `rhesis` and `rhesis.sdk` share
# a namespace package, so resolving one from PyPI while the other is a local editable install makes
# `rhesis.telemetry` stop importing entirely.
rhesis = { path = "../../packages/rhesis", editable = true }
# To wire the upstream integration in permanently, add a line like the one below -- but note the
# path is relative to this file, so it only resolves where that checkout sits beside the repo:
# rhesis-haystack = { path = "../../../haystack-core-integrations/integrations/rhesis", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "E", "F"]

[tool.ruff.lint.isort]
known-first-party = ["visit_prep", "rhesis.sdk"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
