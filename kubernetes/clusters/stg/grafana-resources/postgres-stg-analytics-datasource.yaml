# Read-only datasource for the telemetry analytics database (user_activity,
# endpoint_usage, feature_usage), written by apps/telemetry-processor. Separate database
# from rhesis-stg-db, same CNPG cluster, created by postInitSQL in cnpg-cluster.yaml.
#
# Points at the -rw service for the same reason the app datasource does: stg has no
# replica, so there is no -ro endpoint to choose. Read-only here is enforced by the
# grafana-viewer role's SELECT-only grant, not by the endpoint.
#
# grafana-viewer needs GRANTs inside this database, which cnpg-cluster.yaml cannot issue
# at bootstrap (postInitApplicationSQL only reaches rhesis-stg-db). See the PR description
# for the one-time SQL.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: rhesis-stg-analytics
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: "Rhesis STG Analytics (RW)"
    type: postgres
    access: proxy
    url: rhesis-stg-rw.rhesis.svc:5432
    user: grafana-viewer
    jsonData:
      database: rhesis-analytics-stg-db
      sslmode: disable
      postgresVersion: 1700
    editable: false
  valuesFrom:
    - targetPath: "secureJsonData.password"
      valueFrom:
        secretKeyRef:
          name: grafana-viewer-credentials
          key: password
