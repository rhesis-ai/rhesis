[project]
name = "docs-assistant"
version = "0.1.0"
description = "Docs Assistant: an OpenAI Agents SDK agent that answers Rhesis questions from the live docs"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Engineering Team", email = "engineering@rhesis.ai" },
]
keywords = [
    "llm",
    "ai",
    "agents",
    "documentation",
    "openai-agents",
]
dependencies = [
    "openai-agents>=0.22,<0.23",
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rhesis-sdk",
]

[project.optional-dependencies]
# Only for providers without an OpenAI-compatible endpoint (DOCS_ASSISTANT_PROVIDER=any_llm).
any-llm = ["openai-agents[any-llm]>=0.22,<0.23"]

[project.license]
text = "MIT"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.6",
]

[tool.uv.sources]
rhesis-sdk = { path = "../../sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_assistant"]

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { certifi = false }
constraint-dependencies = [
    "opentelemetry-api>=1.45.1",
    "certifi>=2026.10.19",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "E", "F"]

[tool.ruff.lint.isort]
known-first-party = ["docs_assistant"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
