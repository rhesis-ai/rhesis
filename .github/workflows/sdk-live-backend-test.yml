name: "[Test] SDK fresh install vs live backend"

# Installs this commit's SDK into a fresh venv with the newest third-party deps
# (no lockfile), connects an @endpoint and an @metric to a backend built from
# this commit, and runs a test set through the API. Catches a dependency release
# or a backend change that breaks the SDK within a day (#2859).
#
# The per-PR wheel smoke test checks packaging offline; this is its online half.
# A failed run is the alert: scheduled runs notify by GitHub's failed-workflow email.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'sdk/**'
      - 'packages/rhesis/**'
      - 'tests/docker-compose.test.yml'
      - 'tests/sdk/integration/conftest.py'
      - 'scripts/sdk_live_backend_test.py'
      - '.github/workflows/sdk-live-backend-test.yml'
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  COMPOSE: docker compose -f tests/docker-compose.test.yml --profile sdk

jobs:
  live-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
          enable-cache: false

      - name: Build and start the backend
        run: $COMPOSE up -d --build --wait

      # Same wheels the release ships, built the way the wheel smoke test builds them.
      - name: Build both wheels
        run: |
          python -m pip install --quiet build
          rm -rf packages/rhesis/dist sdk/dist
          (cd packages/rhesis && python -m build)
          (cd sdk && python -m build)

      # rhesis goes in by path too, or the SDK's `rhesis[telemetry]` pulls the published one.
      - name: Install the SDK with the newest deps
        run: |
          venv="$RUNNER_TEMP/sdk-venv"
          uv venv --python "$PYTHON_VERSION" "$venv"
          uv pip install --refresh --python "$venv/bin/python" \
            packages/rhesis/dist/*.whl \
            sdk/dist/*.whl
          {
            echo "## Resolved packages"
            echo '```'
            uv pip list --python "$venv/bin/python"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The integration suite's own seed: org, user, project and a project-scoped token.
      - name: Seed the test token
        working-directory: tests/sdk/integration
        run: |
          uv run --no-project --with pytest --with 'psycopg[binary]' --with cryptography --with requests \
            python -c 'import conftest; conftest.clear_all_tables(); conftest.setup_test_data()'

      - name: Run an @endpoint and @metric through the API
        env:
          RHESIS_BASE_URL: http://localhost:10003
          RHESIS_API_KEY: rh-test-token
          RHESIS_PROJECT_ID: 12340000-0000-4000-8000-000000001234
        run: '"$RUNNER_TEMP/sdk-venv/bin/python" scripts/sdk_live_backend_test.py'

      - name: Backend and worker logs on failure
        if: failure()
        run: $COMPOSE logs --tail 500 sdk-test-backend sdk-test-worker

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
