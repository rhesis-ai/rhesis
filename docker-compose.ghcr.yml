# Override for ./rh start (default): use prebuilt images from GHCR instead of local builds.
# Images are published per release by .github/workflows/publish-ghcr-images.yml.
#
# The tag is the latest release's version, written here by the release tool. On main this
# runs main's compose config against those images, so config changes must keep working with
# them for one release; .github/workflows/quickstart-smoke.yml checks it.
# RHESIS_VERSION overrides it, e.g. to try another release's images.
services:
  backend:
    image: ghcr.io/rhesis-ai/backend:${RHESIS_VERSION:-0.23.0}
    build: !reset null

  worker:
    image: ghcr.io/rhesis-ai/worker:${RHESIS_VERSION:-0.23.0}
    build: !reset null

  beat:
    image: ghcr.io/rhesis-ai/worker:${RHESIS_VERSION:-0.23.0}
    build: !reset null

  frontend:
    image: ghcr.io/rhesis-ai/frontend:${RHESIS_VERSION:-0.23.0}
    build: !reset null
