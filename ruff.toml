
line-length = 100

[lint]
select = [
    "I",
    "E",
    "F",
]

[lint.per-file-ignores]
"__init__.py" = [
    "F401",
]
# Migrations are frozen historical records built around long SQL literals, and
# some need sys.path patched before they can import their helpers.
"**/alembic/versions/*.py" = [
    "E501",
    "E402",
]

[lint.isort]
known-first-party = [
    "rhesis.sdk",
    "rhesis.backend",
    "rhesis.penelope",
    "rhesis.polyphemus",
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
