# CloudNativePG: HA PostgreSQL for production.
# Operator Application: kubernetes/clusters/prd/cnpg-operator.yaml
# Argo CD Application: kubernetes/clusters/prd/cnpg-cluster-application.yaml (sync-wave 5)
#
# Auth: Workload Identity (gkeEnvironment: true). No JSON key — CNPG pods impersonate
# GSA rhesis-cnpg-bk-prd@rhesis-prd.iam.gserviceaccount.com via the KSA annotation below.
# Terraform module cnpg_barman_prd creates the WI IAM binding.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rhesis-prd
  namespace: rhesis
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: "Rhesis production PostgreSQL (CloudNativePG)"
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4-1
  storage:
    size: 100Gi
  # Annotate the CNPG-managed KSA so GKE Workload Identity links it to the GSA.
  serviceAccountTemplate:
    metadata:
      annotations:
        iam.gke.io/gcp-service-account: rhesis-cnpg-bk-prd@rhesis-prd.iam.gserviceaccount.com
  resources:
    requests:
      memory: 1Gi
      cpu: "1"
    limits:
      memory: 4Gi
      # cpu limit intentionally omitted: databases benefit from absorbing CPU bursts.
      # cpu request above ensures correct scheduler placement and a higher relative
      # CPU share under node contention (raised from 500m — k6 stress testing showed
      # the primary's query latency degrading under concurrent backend HPA scale-out).
  postgresql:
    parameters:
      max_connections: "300"
  primaryUpdateStrategy: unsupervised
  managed:
    roles:
      - name: rhesis-admin
        ensure: present
        login: true
        bypassrls: true
        passwordSecret:
          name: rhesis-admin-credentials
      - name: rhesis-user
        ensure: present
        login: true
        bypassrls: false
        passwordSecret:
          name: rhesis-user-credentials
      - name: rhesis-analytics-user
        ensure: present
        login: true
        bypassrls: false
        passwordSecret:
          name: rhesis-analytics-user-credentials
      # postInitSQL/postInitApplicationSQL below grant this role SELECT automatically,
      # but only on a fresh initdb (new environment, or DR restore without a Barman
      # backup). This already-initialized cluster won't rerun that bootstrap SQL, so
      # the same read-only GRANTs still need a one-time manual run against rhesis-prd-db
      # (see PR description / runbook for the exact SQL).
      - name: grafana-viewer
        ensure: present
        login: true
        bypassrls: false
        passwordSecret:
          name: grafana-viewer-credentials
  bootstrap:
    initdb:
      database: rhesis-prd-db
      owner: rhesis-admin
      # Role creation is handled exclusively by spec.managed.roles above to avoid
      # a race condition (duplicate CREATE ROLE would fail with "role already exists").
      postInitSQL:
        - CREATE ROLE "rhesis-analytics-user" WITH LOGIN;
        - CREATE ROLE "rhesis-user" WITH LOGIN;
        - CREATE ROLE "grafana-viewer" WITH LOGIN;
        - CREATE DATABASE "rhesis-analytics-prd-db" OWNER "rhesis-analytics-user";
        - GRANT CONNECT ON DATABASE "rhesis-analytics-prd-db" TO "rhesis-admin";
      postInitApplicationSQL:
        - GRANT ALL ON SCHEMA public TO "rhesis-admin";
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS vector;
        - GRANT CONNECT ON DATABASE "rhesis-prd-db" TO "rhesis-user";
        - GRANT USAGE ON SCHEMA public TO "rhesis-user";
        - GRANT SELECT, INSERT, UPDATE, DELETE, REFERENCES ON ALL TABLES IN SCHEMA public TO "rhesis-user";
        - GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO "rhesis-user";
        - ALTER DEFAULT PRIVILEGES FOR ROLE "rhesis-admin" IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE, REFERENCES ON TABLES TO "rhesis-user";
        - ALTER DEFAULT PRIVILEGES FOR ROLE "rhesis-admin" IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO "rhesis-user";
        - GRANT CONNECT ON DATABASE "rhesis-prd-db" TO "grafana-viewer";
        - GRANT USAGE ON SCHEMA public TO "grafana-viewer";
        - GRANT SELECT ON ALL TABLES IN SCHEMA public TO "grafana-viewer";
        - ALTER DEFAULT PRIVILEGES FOR ROLE "rhesis-admin" IN SCHEMA public GRANT SELECT ON TABLES TO "grafana-viewer";
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: gs://cnpg-backup-rhesis-prd
      serverName: rhesis-prd
      googleCredentials:
        gkeEnvironment: true
