name: "[Deploy] K8s via ArgoCD (reusable)"

# Sets image tags on the ArgoCD Application, then syncs it and waits for health.
# The logic lives in .github/scripts/argocd-set-image-tags.sh (atomic tag write
# through the Kubernetes API) and .github/scripts/argocd-sync.sh.
#
# All-services deploy:  leave `service` empty → every deploy-all service's tag
#                       (chatbot excluded; list in argocd-set-image-tags.sh).
# Per-service deploy:   set `service` to the values key (e.g. backend, workers).
#
# Callers must grant `id-token: write`: the tag write logs in keylessly as
# deploy-ci-<env> (terraform/infrastructure/modules/deploy-ci/gcp).
#
# Required secrets:
#   WIF_PROVIDER                 GitHub Actions workload identity provider
#   DEPLOY_CI_SA_<ENV>           terraform output deploy_ci_service_account_email
#   DEPLOY_CI_GATEWAY_<ENV>      terraform output deploy_ci_gateway_server
#   ARGOCD_SERVER_<ENV>          ArgoCD hostname, without scheme (sync and wait)
#   ARGOCD_AUTH_TOKEN_<ENV>      ArgoCD API token (sync and wait)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (dev, stg, prd)'
        required: true
        type: string
      tag:
        description: 'Image tag to deploy'
        required: true
        type: string
      app_name:
        description: 'ArgoCD application name'
        required: false
        type: string
        default: 'rhesis'
      service:
        description: |
          Values key for a per-service deploy (e.g. backend, workers, frontend,
          chatbot, polyphemus, otelCollector, telemetryProcessor, docs).
          Leave empty to roll all deploy-all services (see deploy-all-k8s.yml).
        required: false
        type: string
        default: ''

jobs:
  deploy:
    # Self-hosted runner inside the target cluster's VPC so ArgoCD's internal
    # hostname (e.g. dev-argocd.rhesis.ai) resolves via kube-dns. Build/push
    # jobs stay on ubuntu-latest because Artifact Registry is public.
    runs-on: ${{ inputs.environment == 'prd' && 'arc-runner-prd' || inputs.environment == 'stg' && 'arc-runner-stg' || 'arc-runner-dev' }}
    permissions:
      contents: read  # checkout, and the compare API that stops tags moving backwards
      id-token: write  # keyless login as deploy-ci-<env>
    env:
      APP: ${{ inputs.app_name }}
      TAG: ${{ inputs.tag }}
      SERVICE: ${{ inputs.service }}
      ENVIRONMENT: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: ./.github/actions/install-deploy-tools

      - name: Log in as deploy-ci
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ inputs.environment == 'prd' && secrets.DEPLOY_CI_SA_PRD || inputs.environment == 'stg' && secrets.DEPLOY_CI_SA_STG || secrets.DEPLOY_CI_SA_DEV }}
          token_format: access_token
          create_credentials_file: false

      - name: Set image tags
        env:
          GATEWAY: ${{ inputs.environment == 'prd' && secrets.DEPLOY_CI_GATEWAY_PRD || inputs.environment == 'stg' && secrets.DEPLOY_CI_GATEWAY_STG || secrets.DEPLOY_CI_GATEWAY_DEV }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: .github/scripts/argocd-set-image-tags.sh

      - name: Sync and wait for health
        env:
          ARGOCD_SERVER: ${{ inputs.environment == 'prd' && secrets.ARGOCD_SERVER_PRD || inputs.environment == 'stg' && secrets.ARGOCD_SERVER_STG || secrets.ARGOCD_SERVER_DEV }}
          ARGOCD_AUTH_TOKEN: ${{ inputs.environment == 'prd' && secrets.ARGOCD_AUTH_TOKEN_PRD || inputs.environment == 'stg' && secrets.ARGOCD_AUTH_TOKEN_STG || secrets.ARGOCD_AUTH_TOKEN_DEV }}
        run: .github/scripts/argocd-sync.sh
