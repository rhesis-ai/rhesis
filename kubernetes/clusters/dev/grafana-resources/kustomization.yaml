apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/grafana-resources
  # dev-only: reads a dev-scoped GSM secret and the Bitnami subchart's service name, so
  # this doesn't belong in base/grafana-resources (shared identically by dev/stg/prd).
  - grafana-viewer-credentials.yaml
  - postgres-dev-datasource.yaml
  # dev-scoped Discord webhook URL; the contact point that consumes it lives in
  # base/grafana-resources (shared identically by dev/stg/prd).
  - discord-webhook-secret.yaml

configMapGenerator:
  - name: grafana-config
    literals:
      - grafana-hostname=dev-grafana.rhesis.ai
      - grafana-root-url=https://dev-grafana.rhesis.ai
    options:
      annotations:
        config.kubernetes.io/local-config: "true"
      disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: grafana-config
      fieldPath: data.grafana-hostname
    targets:
      - select:
          kind: Ingress
          name: grafana-ingress
        fieldPaths:
          - spec.tls.0.hosts.0
          - spec.rules.0.host
  - source:
      kind: ConfigMap
      name: grafana-config
      fieldPath: data.grafana-root-url
    targets:
      - select:
          kind: Grafana
          name: grafana
        fieldPaths:
          - spec.config.server.root_url
