apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd-cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rhesis-ai/rhesis.git
    targetRevision: 8736cdd75931def097c325846ed85d529413e0aa
    path: kubernetes/clusters/prd/cert-manager
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
