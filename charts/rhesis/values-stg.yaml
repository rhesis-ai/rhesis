# Staging environment overrides — merged on top of values.yaml by ArgoCD.
# GCP project: rhesis-stg (Artifact Registry and Vertex AI below).

# ---------------------------------------------------------------------------
# Global — Artifact Registry
# ---------------------------------------------------------------------------
global:
  registry: "europe-west4-docker.pkg.dev/rhesis-stg-494712/rhesis"
  imagePullPolicy: Always
  # Managed by CI — patched to the git SHA tag after each successful build.
  imageTag: "de9832ee"
  requirePinnedTag: true

# DB: app URL uses rhesis-user; migrate.sh / Alembic use rhesis-admin.
# Cluster manifest: kubernetes/clusters/stg/cnpg-cluster/cnpg-cluster.yaml
database:
  existingSecret: "rhesis-user-credentials"
  migrationSecret: "rhesis-admin-credentials"
  usernameKey: username
  passwordKey: password

# ---------------------------------------------------------------------------
# Non-sensitive config
# ---------------------------------------------------------------------------
config:
  environment: "staging"
  # Hosted Rhesis sends as Rhesis AI GmbH.
  emailImprint: |-
    Rhesis AI GmbH
    August-Bebel-Str. 89
    14482 Potsdam, Germany
    Managing Director: Dr. Nicolai Bohn
    Registered at: HRB 39358 Potsdam
    VAT No.: DE368312944
    E-Mail: hello@rhesis.ai
  logLevel: "INFO"
  jsonLoggerEnabled: true
  usageQuotasEnabled: true
  hostedModelDailyBudgetUsd: "25"
  hostedModelOrgDailyBudgetUsd: "2"
  chatbotDailyBudgetUsd: "5"
  hostedModelTokensPerMinute: "300000"
  hostedModelOrgTokensPerMinute: "100000"
  # On after dev's sweeps checked out.
  jobRetentionEnabled: true
  # Live after four clean dry runs (16-19 Oct 2026).
  traceRetentionEnabled: true
  traceRetentionDryRun: false

  # Must match kubernetes/clusters/stg/cnpg-cluster/cnpg-cluster.yaml bootstrap.initdb.database
  dbName: "rhesis-stg-db"
  dbUser: "rhesis-admin"

  # Frontend
  supportEmail: "hello@rhesis.ai"
  onboardingVideoUrl: "https://youtu.be/lLLj6S5T1Ig"
  architectHelpArticleUrls: "https://docs.rhesis.ai/docs/getting-started/connecting-application,https://docs.rhesis.ai/docs/endpoints,https://docs.rhesis.ai/docs/endpoints/sdk-endpoints,https://docs.rhesis.ai/docs/concepts"
  # Backend
  rhesisBaseUrl: "https://stg-api.rhesis.ai"
  frontendUrl: "https://stg-app.rhesis.ai"
  # Disposable-email screening: off | log | enforce. Ran as log from #2511 so the
  # community list's false-positive rate could be measured; enforcing since 2026-08-21.
  authBlockDisposableEmails: "enforce"
  authDisposableEmailExtraDomains: ""
  authDefaultSsoOrganization: ""

  # vertexAiProject is deliberately not set: it derives from the service account
  # key delivered as GOOGLE_APPLICATION_CREDENTIALS, so rotating the key moves
  # identity and project together. See values.yaml.

  # AI / Vertex (same model stack as dev; override per staging policy if needed)
  defaultGenerationModel: "vertex_ai/gemini-3.1-flash-lite"
  defaultEvaluationModel: "vertex_ai/gemini-3.1-flash-lite"
  defaultExecutionModel: "vertex_ai/gemini-3.1-flash-lite"
  defaultEmbeddingModel: "vertex_ai/text-embedding-005"
  vertexAiLocation: "eu"
  vertexAiEmbeddingLocation: "europe-west4"
  azureOpenAiApiVersion: "2024-02-01"

# ---------------------------------------------------------------------------
# Ingress — stg (internal; VPN / same pattern as dev)
# ---------------------------------------------------------------------------
backend:
  # Two pods so a node drain (autoscaler scale-down, GKE upgrade) never leaves
  # the Service without an endpoint; the PDB template keys off this.
  replicas: 2
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      # Garak probe cache pre-warm loads probes + wordnet; 1Gi OOMKills the API.
      memory: "2Gi"
      cpu: "1000m"
  ingress:
    enabled: true
    host: "stg-api.rhesis.ai"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod-dns01"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "25m"
  # Covers boot only (imports, garak probe cache pre-warm): migrations run in
  # the PreSync Job, so the pod no longer waits on `alembic upgrade head`.
  # Budget = 30 + 17*10 = ~3.5min, same as prd. Liveness below stays tight
  # because it does not start until this succeeds.
  startupProbe:
    httpGet:
      path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 18
  livenessProbe:
    httpGet:
      path: /health
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 5
  # No real initial delay: the startupProbe already holds this back until boot
  # succeeds, and /ready is what pulls the pod out of the Service when the
  # database goes away -- delaying it only delays that.
  readinessProbe:
    httpGet:
      path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 5

frontend:
  replicas: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      # 250m throttled the Next.js cold start enough for the static /api/health
      # readiness probe to time out; matches prd.
      cpu: "500m"
  ingress:
    enabled: true
    host: "stg-app.rhesis.ai"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod-dns01"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

workers:
  - name: default
    enabled: true
    image:
      repository: rhesis-worker
      tag: "de9832ee"
    replicas: 1
    resources:
      requests:
        # The split layout uses about 2.1Gi per pod under load.
        memory: "2Gi"
        cpu: "250m"
      limits:
        memory: "3Gi"
        cpu: "500m"
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
      # No memory target (as in prd): Python RSS does not come back down after a run,
      # so memory pins the workers at maxReplicas.
      # Scale on the jobs waiting in each queue (templates/worker/hpa.yaml). The CPU
      # target above only applies without KEDA.
      keda:
        enabled: true
        # Waiting jobs per replica, by queue. A worker pod already holds as many as it
        # runs (24 test runs; 256 trace evaluations with prefetch), so these count overflow.
        queues:
          test-runs: 2
          long-jobs: 4
          trace-ingest: 200
          trace-eval: 200
          quick-tasks: 100
          cpu-bound: 2  # one prefork child per pod: file text extraction, graphs, Garak imports
    # Autoscaler scale-down never drains this pod's node, so a post-deploy
    # scale-down cannot kill an in-flight test run. A GKE node upgrade still
    # can; at this usage that is a rare, accepted interruption.
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    env:
      # One Celery process per kind of job (apps/worker/start.sh): test runs and long jobs,
      # trace ingest, trace evaluation and short jobs, Architect, CPU-bound. Uses about
      # 2.1 GiB per pod under load; "combined" goes back to one main process.
      - name: WORKER_LAYOUT
        value: "split"
      # Read only by WORKER_LAYOUT=combined; kept for a quick switch back.
      - name: CELERY_WORKER_CONCURRENCY
        value: "16"
      - name: CELERY_ARCHITECT_CONCURRENCY
        value: "8"

docs:
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  ingress:
    enabled: true
    host: "stg-docs.rhesis.ai"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod-dns01"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

chatbot:
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "1000m"
  ingress:
    enabled: true
    host: "stg-chatbot.rhesis.ai"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod-dns01"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

otelCollector:
  ingress:
    enabled: true
    host: "stg-telemetry.rhesis.ai"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod-dns01"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

telemetryProcessor:
  enabled: true

polyphemus:
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  ingress:
    enabled: true
    host: "stg-polyphemus.rhesis.ai"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod-dns01"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
  livenessProbe:
    httpGet:
      path: /health
    initialDelaySeconds: 90
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

# PostgreSQL disabled for stg — use CNPG Cluster; host must match CNPG Cluster + -rw
postgresql:
  enabled: false

externalDatabase:
  # Must match the CNPG read-write Service for your Cluster (metadata.name = rhesis-stg)
  host: "rhesis-stg-rw.rhesis.svc.cluster.local"
  port: "5432"
  # PgBouncer for the app (kubernetes/clusters/stg/cnpg-cluster/pooler.yaml).
  poolerHost: "rhesis-stg-pooler-rw.rhesis.svc.cluster.local"

# Analytics DB — lives in the same CNPG cluster as the main DB (rhesis-stg).
# Created by postInitSQL in kubernetes/clusters/stg/cnpg-cluster/cnpg-cluster.yaml.
# Owner: rhesis-analytics-user (password from rhesis-analytics-user-credentials via ESO).
externalAnalyticsDatabase:
  host: "rhesis-stg-rw.rhesis.svc.cluster.local"
  port: "5432"
  name: "rhesis-analytics-stg-db"

valkey:
  enabled: true
  auth:
    enabled: true
    existingSecret: "rhesis-app-secrets"
    existingSecretPasswordKey: "REDIS_PASSWORD"
  primary:
    persistence:
      enabled: true
      size: 1Gi
