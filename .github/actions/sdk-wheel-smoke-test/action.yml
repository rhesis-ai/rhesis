name: SDK Wheel Smoke Test
description: Build both wheels once, then prove the core and [all] installs work

inputs:
  python-version:
    description: Interpreter for the fresh venv. rhesis-sdk requires >= 3.12.
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: latest
        enable-cache: true
        ignore-nothing-to-cache: true

    # The SDK test suite runs against sdk/src, so it never sees what the built
    # artifact contains. `python -m build` builds the wheel from the sdist, so a
    # too-narrow include list ships a wheel without the package (#2834).
    - name: Build both wheels
      shell: bash
      run: |
        python -m pip install --quiet build
        rm -rf packages/rhesis/dist sdk/dist
        (cd packages/rhesis && python -m build)
        (cd sdk && python -m build)

    # Each install gets its own fresh venv and a fresh resolve from PyPI, so an
    # undeclared core dependency or an unbounded [all] one breaks here first.
    # The rhesis wheel goes in by path both times: the SDK depends on
    # `rhesis[telemetry]`, and on its own it would pull the published rhesis.
    - name: Smoke test the core install
      shell: bash
      run: |
        venv="$RUNNER_TEMP/smoke-venv-core"
        uv venv --python ${{ inputs.python-version }} "$venv"
        uv pip install --python "$venv/bin/python" \
          packages/rhesis/dist/*.whl \
          sdk/dist/*.whl
        "$venv/bin/python" scripts/sdk_wheel_smoke_test.py --profile core \
          packages/rhesis/dist/*.whl \
          sdk/dist/*.whl

    - name: Smoke test the [all] install
      shell: bash
      run: |
        venv="$RUNNER_TEMP/smoke-venv-all"
        sdk_wheel=$(echo sdk/dist/*.whl)
        uv venv --python ${{ inputs.python-version }} "$venv"
        uv pip install --python "$venv/bin/python" \
          packages/rhesis/dist/*.whl \
          "${sdk_wheel}[all]"
        "$venv/bin/python" scripts/sdk_wheel_smoke_test.py --profile all \
          packages/rhesis/dist/*.whl \
          "$sdk_wheel"
