apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-external
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: "4.14.3"
    helm:
      valuesObject:
        controller:
          # Two pods on different nodes: with externalTrafficPolicy Local the load
          # balancer only sends to nodes running one, so a single pod moving
          # nodes would drop traffic until the health check flips. The chart adds
          # a PodDisruptionBudget (minAvailable 1) for more than one replica.
          replicaCount: 2
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ingress-nginx
                  app.kubernetes.io/instance: ingress-nginx-external
                  app.kubernetes.io/component: controller
          config:
            use-gzip: "true"
            gzip-types: "application/json application/javascript text/css text/plain application/xml"
            enable-brotli: "true"
            brotli-types: "application/json application/javascript text/css text/plain application/xml"
          ingressClassResource:
            name: external
            enabled: true
            default: false
            controllerValue: k8s.io/ingress-nginx-external
          ingressClass: external
          service:
            enabled: true
            # Keep the client's source IP. Cluster SNATs it to a node address, so
            # the backend's audit log and rate limits saw only 10.x addresses.
            externalTrafficPolicy: Local
            external:
              enabled: true
              type: LoadBalancer
            internal:
              enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx-external
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
