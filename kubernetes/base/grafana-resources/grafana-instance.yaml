apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: monitoring
  labels:
    dashboards: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  disableDefaultAdminSecret: true
  deployment:
    spec:
      replicas: 1
      template:
        spec:
          containers:
            - name: grafana
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              env:
                - name: GF_SECURITY_ADMIN_USER
                  value: "admin"
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-credentials
                      key: admin-password
                - name: GF_USERS_ALLOW_SIGN_UP
                  value: "false"
                # Reuses the app's own SMTP credentials (see grafana-smtp-credentials.yaml
                # in each cluster's grafana-resources overlay) so alert emails work.
                - name: GF_SMTP_ENABLED
                  value: "true"
                - name: GF_SMTP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: grafana-smtp-credentials
                      key: host
                - name: GF_SMTP_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-smtp-credentials
                      key: user
                - name: GF_SMTP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-smtp-credentials
                      key: password
                # Filled in by kustomize from the grafana-alert-email ConfigMap (see
                # kustomization.yaml), not the app's FROM_EMAIL secret: that value is
                # formatted as `"Display Name" <hello@rhesis.ai>` for the app's email
                # library, but Grafana's from_address rejects anything but a bare address.
                - name: GF_SMTP_FROM_ADDRESS
                  value: PLACEHOLDER
                - name: GF_SMTP_FROM_NAME
                  value: "Rhesis Alerts"
                # Declared here (not clicked through the UI) so it survives ArgoCD's
                # selfHeal instead of being wiped on the next sync. See
                # grafana-google-oidc-credentials.yaml in each cluster's grafana-resources
                # overlay for the client id/secret.
                - name: GF_AUTH_GOOGLE_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: grafana-google-oidc-credentials
                      key: client-id
                - name: GF_AUTH_GOOGLE_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-google-oidc-credentials
                      key: client-secret
  config:
    server:
      root_url: PLACEHOLDER
    auth.anonymous:
      enabled: "false"
    auth.google:
      enabled: "true"
      allow_sign_up: "true"
      allowed_domains: rhesis.ai
