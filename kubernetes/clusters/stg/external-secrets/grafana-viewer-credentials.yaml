# Password for the read-only "grafana-viewer" CNPG role (staging).
# Create the GSM secret before sync (same project as ClusterSecretStore):
#   stg-grafana-viewer-password
#
# ESO GSA already has project-level secretmanager.secretAccessor (see
# terraform/infrastructure/modules/external-secrets/gcp/service_account.tf), so no
# extra IAM binding is needed for this key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-viewer-credentials
  namespace: rhesis
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: grafana-viewer-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: grafana-viewer
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: stg-grafana-viewer-password
