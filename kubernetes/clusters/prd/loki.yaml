apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/rhesis-ai/rhesis.git
    targetRevision: c6b8511c8e3b022517c69de0be8a6a01d7fe8825
    path: kubernetes/clusters/prd/loki
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
