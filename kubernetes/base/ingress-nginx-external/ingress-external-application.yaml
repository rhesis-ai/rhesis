apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-external
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: "4.14.3"
    helm:
      valuesObject:
        controller:
          # Two pods on different nodes: with externalTrafficPolicy Local the load
          # balancer only sends to nodes running one, so a single pod moving
          # nodes would drop traffic until the health check flips. The chart adds
          # a PodDisruptionBudget (minAvailable 1) for more than one replica.
          replicaCount: 2
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ingress-nginx
                  app.kubernetes.io/instance: ingress-nginx-external
                  app.kubernetes.io/component: controller
          config:
            use-gzip: "true"
            gzip-types: "application/json application/javascript text/css text/plain application/xml"
            enable-brotli: "true"
            brotli-types: "application/json application/javascript text/css text/plain application/xml"
            # Behind the Cloudflare proxy the TCP peer is a Cloudflare edge, so take
            # the visitor from CF-Connecting-IP. nginx honours that header only when
            # the peer is in proxy-real-ip-cidr (the default is 0.0.0.0/0, which would
            # let anyone spoof it), and then sends the visitor IP upstream as both
            # X-Real-IP and X-Forwarded-For. Direct, unproxied clients are unaffected.
            enable-real-ip: "true"
            forwarded-for-header: "CF-Connecting-IP"
            # Kept current by scripts/refresh-cloudflare-ips.py.
            # cloudflare-ips:begin csv
            proxy-real-ip-cidr: "103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,104.16.0.0/13,104.24.0.0/14,108.162.192.0/18,131.0.72.0/22,141.101.64.0/18,162.158.0.0/15,172.64.0.0/13,173.245.48.0/20,188.114.96.0/20,190.93.240.0/20,197.234.240.0/22,198.41.128.0/17,2400:cb00::/32,2405:8100::/32,2405:b500::/32,2606:4700::/32,2803:f800::/32,2a06:98c0::/29,2c0f:f248::/32"
            # cloudflare-ips:end
          ingressClassResource:
            name: external
            enabled: true
            default: false
            controllerValue: k8s.io/ingress-nginx-external
          ingressClass: external
          service:
            enabled: true
            # Keep the client's source IP. Cluster SNATs it to a node address, so
            # the backend's audit log and rate limits saw only 10.x addresses.
            externalTrafficPolicy: Local
            external:
              enabled: true
              type: LoadBalancer
            internal:
              enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx-external
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
