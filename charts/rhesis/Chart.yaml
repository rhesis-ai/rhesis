apiVersion: v2
name: rhesis
description: Rhesis AI Platform — Frontend, Backend, Workers, Chatbot, Polyphemus, Docs, OTel Collector, Telemetry Processor
type: application
# Both are set to the platform version by the release tool, so the chart a release
# tag ships defaults its image tags to that release (see rhesis.image).
version: 0.23.1
appVersion: "0.23.1"
maintainers:
  - name: Rhesis Team

dependencies:
  - name: valkey
    version: "~2.x"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: valkey.enabled

  - name: postgresql
    version: "~15.x"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgresql.enabled

  - name: opentelemetry-collector
    version: "~0.x"
    repository: "https://open-telemetry.github.io/opentelemetry-helm-charts"
    condition: opentelemetry-collector.enabled
