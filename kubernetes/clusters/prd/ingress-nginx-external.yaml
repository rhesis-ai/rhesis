apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd-ingress-nginx-external
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rhesis-ai/rhesis.git
    targetRevision: d9c9b9594e069eea319933282bda6b66eb06db89
    path: kubernetes/clusters/prd/ingress-nginx-external
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
