apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd-external-dns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rhesis-ai/rhesis.git
    targetRevision: 25df411d098c1379e3e2e64abc9bbddbfb62b5c4
    path: kubernetes/clusters/prd/external-dns
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
