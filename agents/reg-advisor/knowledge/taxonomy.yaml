# EU & US health product regulation taxonomy.
#
# Source: "EU & US Health Product Regulation - Reference Taxonomy (v1.0, verified 11 Aug 2026)",
# sections D1 and D2. The four nodes D2 emitted (EU-MD-CLASS-011, US-SW-CDS-3060, US-QMSR-820,
# EU-AI-HIGHRISK-006) keep their field values; only their `related_nodes` lists grew, because D2
# could only cross-link the four nodes it emitted. The rest are authored to the same schema so
# every decision-tree terminal resolves to a real node.
#
# `parent_id` names a grouping, not necessarily another node — this follows the source document,
# where nodes hang off group ids like `EU-MD-CLASS` that are not themselves emitted.
#
# NOT LEGAL ADVICE. Verify every citation against the primary source before relying on it.

version: "1.0"
verified_on: "2026-08-11"

