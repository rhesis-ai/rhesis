apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - grafana-instance.yaml
  - grafana-ingress.yaml
  - prometheus-datasource.yaml
  - loki-datasource.yaml
  # Picks its Postgres datasource by template variable, so one copy works in every env.
  - usage-dashboard.yaml
  # Alerting: identical in every env. Each cluster's ExternalSecret (see
  # clusters/*/grafana-resources/discord-webhook-secret.yaml and
  # grafana-smtp-credentials.yaml) fills in the two things that differ — the Discord
  # webhook URL and the SMTP creds — via secret names local to that cluster's
  # monitoring namespace.
  - basic-alerts-folder.yaml
  - contact-point.yaml
  - notification-policy.yaml
  - basic-alerts.yaml
