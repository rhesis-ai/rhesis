[lint.isort]
known-first-party = [
    "rhesis.sdk",
    "rhesis.backend",
    "rhesis.penelope",
    "rhesis.polyphemus",
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
