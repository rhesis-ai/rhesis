# Same GSM key as rhesis/grafana-viewer-credentials (external-secrets/grafana-viewer-credentials.yaml),
# synced separately into monitoring so the GrafanaDatasource CR in this namespace can read it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-viewer-credentials
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: grafana-viewer-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: stg-grafana-viewer-password
