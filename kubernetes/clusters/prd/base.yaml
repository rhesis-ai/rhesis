apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd-base
  namespace: argocd
  annotations:
    # prd-base is excluded from its own kustomization (see kustomization.yaml)
    # to avoid overwriting the imperative SHA pin set by publish-release.yml.
    # Without this annotation, prune deletes prd-base on every sync.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  source:
    repoURL: https://github.com/rhesis-ai/rhesis.git
    targetRevision: release/v0.12.0
    path: kubernetes/clusters/prd
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
