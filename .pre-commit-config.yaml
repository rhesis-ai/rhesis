repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict

  - repo: local
    hooks:
        - id: trufflehog
          name: TruffleHog
          description: Detect secrets in your data.
          # Lob excluded for the same reason as in .github/workflows/security.yml: it flags any
          # 40-character test_* function name as a verified key. uv.lock files are excluded via
          # .trufflehog-exclude-paths; see that file for why.
          entry: >-
            bash -c 'trufflehog git file://. --branch HEAD --exclude-detectors=Lob
            --exclude-paths=.trufflehog-exclude-paths'
          language: system
          stages: ["pre-commit", "pre-push"]

        - id: sdk
          name  : format sdk
          language: system
          entry: make -C sdk format
          files: ^sdk/
          pass_filenames: false

        - id: rhesis-package
          name: format rhesis package
          language: system
          entry: bash -c "uvx ruff format packages/rhesis && uvx ruff check --fix packages/rhesis"
          files: ^packages/rhesis/
          pass_filenames: false

        - id: backend
          name  : format backend
          language: system
          entry: make -C apps/backend format_diff
          files: ^apps/backend/
          pass_filenames: false

        - id: frontend-format
          name: auto-fix frontend formatting
          language: system
          entry: bash -c "cd apps/frontend && npm run format"
          files: ^apps/frontend/
          pass_filenames: false

        - id: frontend-lint
          name: lint frontend
          language: system
          entry: bash -c "cd apps/frontend && npm run lint"
          files: ^apps/frontend/
          pass_filenames: false

        - id: docs-format
          name: auto-fix docs formatting
          language: system
          entry: bash -c "cd apps/documentation && npm run format"
          files: ^apps/documentation/
          pass_filenames: false

        # - id: hardcoded-styles
        #   name: check hardcoded styles in frontend and docs
        #   language: system
        #   entry: node scripts/check-hardcoded-styles.js
        #   files: ^apps/(frontend|documentation)/
        #   pass_filenames: false
