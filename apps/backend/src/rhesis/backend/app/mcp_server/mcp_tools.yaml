tools:
  # ── Projects ──────────────────────────────────────────────
  - name: list_projects
    label: Listing projects
    method: GET
    path: /projects/
    page_size: 50
    description: >
      List projects in the current organization. Use $select to request
      only the fields you need (e.g. $select=name,id).

  - name: get_project
    label: Retrieving project
    method: GET
    path: /projects/{project_id}
    description: >
      Get one project by ID. ENTITY: Project. PREREQUISITES: project_id
      from list_projects. CHAIN: use when the user asks about a specific
      project by name. NOT needed before create_endpoint — that takes its
      project from the request scope. NEVER: ask the user for a project ID
      when they gave a name — use list_projects with $filter first.
    parameters:
      project_id:
        description: "REQUIRED. UUID of the project."

  - name: create_project
    label: Creating project
    method: POST
    path: /projects/
    requires_confirmation: true
    description: >
      Create a new project to organize test suites. A project groups
      related test sets, test configurations, and test runs.
    parameters:
      name:
        description: "REQUIRED. Project name (string)."
      description:
        description: "What this project covers (string)."
      project_id:
        description: >
          Omit. The project scope is taken from the request, not from
          this field.
      is_active:
        description: "Omit. New projects are active by default."
      icon:
        description: "Omit unless the user asked for a specific icon."
      attributes:
        description: "Omit. Free-form storage, not used by test generation."

  # ── Test Sets ─────────────────────────────────────────────
  - name: list_test_sets
    label: Listing test sets
    method: GET
    path: /test_sets/
    page_size: 20
    description: >
      List test sets in the organization. ENTITY: TestSet.
      PREREQUISITES: none. CHAIN: resolve by name here, then
      get_test_set for full metadata or list_test_set_tests for
      contained tests; pass id to execute_test_set. Use $select
      (e.g. $select=name,id,description) to keep payloads small.

  - name: get_test_set
    label: Retrieving test set
    method: GET
    path: /test_sets/{test_set_identifier}
    description: >
      Get one test set by UUID, nano_id, or slug. ENTITY: TestSet.
      PREREQUISITES: test_set_identifier from list_test_sets or
      get_job_status after generate_test_set. CHAIN: after generation
      completes, call this for set metadata, then list_test_set_tests
      to verify prompts before execute_test_set. NEVER: use org-wide
      list_tests when you already have the test set ID.
    parameters:
      test_set_identifier:
        description: "REQUIRED. Test set UUID, nano_id, or slug."

  - name: update_test_set
    label: Updating test set
    method: PUT
    path: /test_sets/{test_set_identifier}
    requires_confirmation: true
    description: >
      Update test set metadata (name, description, etc.). ENTITY: TestSet.
      PREREQUISITES: test_set_identifier from list_test_sets or get_test_set.
      CHAIN: resolve with list_test_sets first; use get_test_set to
      confirm current values. Send ONLY fields to change. Does NOT
      regenerate or replace tests — use generate_test_set for new content.
      Do NOT send server-managed fields (id, user_id, organization_id,
      created_at, updated_at).
    parameters:
      test_set_identifier:
        description: "REQUIRED. Test set UUID, nano_id, or slug."
      name:
        description: "New test set name (string). Omit to keep unchanged."
      description:
        description: "New description (string). Omit to keep unchanged."
      short_description:
        description: "Brief summary, one line (string). Omit to keep unchanged."

  - name: create_test_set_bulk
    label: Creating test set
    method: POST
    path: /test_sets/bulk
    requires_confirmation: true
    description: >
      Create a test set with manually specified tests. Prefer
      generate_test_set for AI-generated test content — use this tool
      only when importing specific, user-provided test prompts that
      must be used verbatim. The "tests" array is REQUIRED and must
      contain at least one test object. Do NOT send server-managed
      fields (id, user_id, organization_id, created_at, updated_at).
      PRECONDITION: when a saved plan is in effect, every requirement,
      metric, and requirement→metric mapping in the plan must be marked
      completed before this tool can run. Calling it earlier is
      rejected with "Cannot generate test sets yet…" — finish the
      prerequisite steps (requirements, metrics, mapping links) first.
    parameters:
      name:
        description: "Test set name (required, string)"
      project_id:
        description: >
          Omit. The project scope is taken from the request, not from
          this field.
      description:
        description: "Detailed description of the test set's purpose (string)"
      short_description:
        description: "Brief summary, one line (string)"
      test_set_type:
        description: >
          REQUIRED. "Single-Turn" or "Multi-Turn". Must match the
          test_type of the tests in the array. A Multi-Turn test set
          must contain Multi-Turn tests; a Single-Turn test set must
          contain Single-Turn tests.
      priority:
        description: >
          Integer priority value (e.g. 1, 2, 3). Must be an integer, NOT
          a string like "High" or "Low". Omit if unsure.
      tests:
        description: >
          REQUIRED array of test objects (must not be empty). The item
          fields are listed below; two things the schema cannot express:

          1. A Single-Turn test carries "prompt". A Multi-Turn test sets
          test_type to "Multi-Turn" and carries "test_configuration"
          INSTEAD of prompt — never send both on the same test. The
          test_configuration object takes: goal (required — what the
          target SHOULD do), instructions (how to conduct the test),
          restrictions (what the target MUST NOT do), scenario (context
          and persona) and max_turns (integer, e.g. 10).

          2. requirement, category and topic are plain-text names, not
          UUIDs — the server resolves or creates them automatically. Use
          list_requirements, list_categories and list_topics to reuse
          existing values rather than inventing near-duplicates.
      metadata:
        description: >
          Omit. Free-form storage the synthesizers use to record how a
          test set was produced.

  - name: generate_test_set
    label: Generating test set
    method: POST
    path: /test_sets/generate
    requires_confirmation: true
    description: >
      Generate a test set using the Rhesis synthesizer. An LLM creates
      diverse, well-structured test prompts based on the generation config
      you provide. The tests are persisted to the database automatically.
      This runs as a background task — the response includes a task_id.
      Poll get_job_status with that task_id until status is "SUCCESS",
      then extract test_set_id from the result. CHAIN: after SUCCESS →
      get_test_set + list_test_set_tests to verify content → offer
      execute_test_set. For grounded tests, pass source IDs from
      list_sources or create_source in the sources parameter.
      Supports both Single-Turn and Multi-Turn test generation via the
      test_type parameter.
      PRECONDITION: when a saved plan is in effect, every requirement,
      metric, and requirement→metric mapping in the plan must be marked
      completed before this tool can run (see "Plan progress" in the
      iteration prompt — all categories must read N/N). Calling it
      earlier is rejected with "Cannot generate test sets yet…" —
      finish the prerequisite steps (requirements, metrics, mapping
      links) first.
    parameters:
      config:
        description: >
          REQUIRED. Generation parameters. Be specific in
          generation_prompt (e.g. "Generate tests that verify the travel
          agent provides accurate destination info, handles ambiguous
          queries, and refuses off-topic requests") — the synthesizer
          uses it to craft the test prompts. requirements takes requirement
          names, e.g. ["Provides Accurate Information", "Refuses
          Off-Topic Requests"]; categories and topics take names too,
          e.g. ["Functional", "Safety"] and ["Travel advisory",
          "Booking"].
      num_tests:
        description: >
          Number of tests to generate (integer, default 5). Typical
          range: 3–20 per test set.
      batch_size:
        description: >
          Omit unless you have a reason to change it. Defaults to 20.
      project_id:
        description: >
          Omit. The project scope is taken from the request, not from
          this field.
      test_type:
        description: >
          "Single-Turn" or "Multi-Turn". MUST match the plan's
          test_type for this test set — if the plan says Multi-Turn,
          pass "Multi-Turn" here. Single-Turn tests generate a prompt
          and evaluate the response. Multi-Turn tests generate a goal
          and instructions that drive a conversation over several
          turns. Default: "Single-Turn" — you MUST override this for
          Multi-Turn sets.
      name:
        description: >
          Name for the generated test set (string). Use the test set
          name from your plan.
      sources:
        description: >
          Optional. List of knowledge source objects to ground the generated
          tests in real content. Each object must contain only the id field:
          [{"id": "<source-uuid>"}]. The backend fetches the source content
          by ID automatically and injects it into the synthesizer — do NOT
          attempt to load or pass source content yourself. Use list_sources
          to discover available sources and pass their IDs here.
          LIMITATION: only Single-Turn test generation uses sources.
          Multi-Turn tests currently ignore this parameter.

  - name: execute_test_set
    label: Running test set
    method: POST
    path: /test_sets/{test_set_identifier}/execute/{endpoint_id}
    requires_confirmation: false
    description: >
      Run a complete test set against an endpoint. ENTITY: TestSet +
      Endpoint → TestRun. PREREQUISITES: test_set_identifier from
      list_test_sets or get_job_status; endpoint_id from list_endpoints
      or get_endpoint. CHAIN: after response use get_test_run for
      totals, then get_insights(entity=test_result,
      test_run_ids=[<test_run_id>], measures=[count,passed,failed,pass_rate]) and
      list_test_results filtered by test_run_id. The backend auto-creates
      the internal test configuration — do NOT create test configurations
      manually. Response includes test_run_id and task_id.
    parameters:
      test_set_identifier:
        description: "REQUIRED. Test set UUID, nano_id, or slug (path parameter)."
      endpoint_id:
        description: "REQUIRED. The UUID of the target endpoint (path parameter)."

  - name: list_test_set_tests
    label: Listing tests in test set
    method: GET
    path: /test_sets/{test_set_identifier}/tests
    page_size: 20
    default_query:
      $select: "id,prompt,requirement,category,topic"
    description: >
      List tests that belong to one test set. ENTITY: Test (scoped to
      TestSet). PREREQUISITES: test_set_identifier from list_test_sets
      or get_job_status after generate_test_set. CHAIN: after
      generate_test_set completes, call get_test_set then this tool to
      verify prompts before execute_test_set. NEVER: use org-wide
      list_tests when you already have the test set ID.
    parameters:
      test_set_identifier:
        description: "REQUIRED. Test set UUID, nano_id, or slug."

  - name: get_test_set_metrics
    label: Checking test set metrics
    method: GET
    path: /test_sets/{test_set_identifier}/metrics
    description: >
      List metrics associated with a test set. ENTITY: TestSet → Metric.
      PREREQUISITES: test_set_identifier from list_test_sets or
      get_test_set. CHAIN: call before execute_test_set to see which
      metrics will run (set-level overrides vs requirement defaults). Empty
      list means requirement-linked metrics apply per test. Complement with
      get_metric_requirements on individual metrics.
    parameters:
      test_set_identifier:
        description: "REQUIRED. Test set UUID, nano_id, or slug."

  - name: get_test_set_last_run
    label: Finding last test run
    method: GET
    path: /test_sets/{test_set_identifier}/last-run/{endpoint_id}
    description: >
      Get the most recent completed test run for a test set + endpoint
      pair. ENTITY: TestSet + Endpoint → TestRun. PREREQUISITES:
      test_set_identifier and endpoint_id from list_test_sets and
      list_endpoints. CHAIN: use when offering run comparison ("compare
      with last run") or before re-scoring. Returns 404 if no completed
      run exists yet. Pass test_run_ids to get_insights for
      side-by-side analysis.
    parameters:
      test_set_identifier:
        description: "REQUIRED. Test set UUID, nano_id, or slug."
      endpoint_id:
        description: "REQUIRED. UUID of the endpoint."

  # ── OWASP & Garak Security Test Generation ─────────────────
  - name: list_owasp_categories
    label: Listing OWASP risk categories
    method: GET
    path: /owasp/categories
    description: >
      List the risk categories (report sections) of an OWASP Top 10 report.
      ENTITY: OwaspCategory. PREREQUISITES: none. CHAIN: call before
      generate_owasp_test_set to resolve category ids (e.g. "llm01") and
      confirm report scope with the user. Omitting categories in
      generate_owasp_test_set targets every category in the report.
    parameters:
      framework:
        description: >
          "llm" (default, OWASP Top 10 for LLM Applications) or "agentic"
          (OWASP Top 10 for Agentic AI). Omit for the LLM report.

  - name: generate_owasp_test_set
    label: Generating OWASP test set
    method: POST
    path: /owasp/generate
    requires_confirmation: true
    description: >
      Generate a test set of adversarial prompts from an OWASP Top 10
      report, tailored to the described system under test. An LLM crafts
      attack prompts for each selected risk category. Tests are persisted
      automatically. This runs as a background task — the response includes
      a task_id. Poll get_job_status with that task_id until status is
      "SUCCESS", then extract test_set_id from the result. CHAIN: use
      list_owasp_categories first to resolve category ids; after SUCCESS →
      get_test_set + list_test_set_tests to verify content → offer
      execute_test_set.
    parameters:
      framework:
        description: >
          "llm" (default) or "agentic" — must match the report
          list_owasp_categories was called with, if categories were
          resolved from it.
      purpose:
        description: >
          REQUIRED. What the system under test does, e.g. "Customer
          service chatbot for a bank". Drives every generated attack.
      categories:
        description: >
          Risk category ids to generate for, e.g. ["llm01", "llm07"]. Omit
          to target every category in the selected report.
      num_tests:
        description: >
          Total tests to generate, spread evenly across the selected
          categories (integer, default 20, max 200).
      name:
        description: "Name for the generated test set (string). Omit for an auto-generated name."
      batch_size:
        description: "Omit unless you have a reason to change it. Defaults to 10."
      model_id:
        description: "Omit. Uses the user's default generation model unless overridden."
      test_type:
        description: '"Single-Turn" (default) or "Multi-Turn" conversational attacks.'

  - name: list_garak_probes
    label: Listing Garak probes
    method: GET
    path: /garak/probes
    description: >
      List all available Garak probe modules and their probe classes.
      ENTITY: GarakProbeModule/GarakProbeClass. PREREQUISITES: none. CHAIN:
      resolve module_name/class_name here, then use import_garak_probes for
      probes where is_dynamic is false (the majority), or
      generate_garak_test_set for probes where is_dynamic is true. Each
      probe/module also carries the Rhesis category, topic, and requirement
      it maps to.

  - name: import_garak_probes
    label: Importing Garak probes
    method: POST
    path: /garak/import
    requires_confirmation: true
    description: >
      Import selected static Garak probes as Rhesis test sets — one test
      set per probe, using the probe's built-in prompts (no LLM
      generation). Use for probes where list_garak_probes reports
      is_dynamic: false. This runs as a background task — the response
      includes a task_id. Poll get_job_status until status is "SUCCESS",
      then extract test_set_id(s) from the result. CHAIN: resolve probes
      via list_garak_probes first; after SUCCESS → get_test_set +
      list_test_set_tests to verify content → offer execute_test_set.
    parameters:
      probes:
        description: >
          REQUIRED, non-empty array. Each entry: {"module_name": ...,
          "class_name": ..., "custom_name": <optional>}, resolved from
          list_garak_probes.
      name_prefix:
        description: 'Prefix for auto-generated test set names. Defaults to "Garak".'
      description_template:
        description: "Optional description template applied to each created test set."

  - name: generate_garak_test_set
    label: Generating Garak test set
    method: POST
    path: /garak/generate
    requires_confirmation: true
    description: >
      Generate a test set from a **dynamic** Garak probe (one with no
      static prompts — list_garak_probes reports is_dynamic: true for it),
      by synthesising prompts with the user's configured LLM based on the
      probe's goal and tags. This runs as a background task — the response
      includes a task_id. Poll get_job_status until status is "SUCCESS",
      then extract test_set_id from the result. CHAIN: resolve module_name
      and class_name from list_garak_probes first; use import_garak_probes
      instead for non-dynamic probes.
    parameters:
      module_name:
        description: "REQUIRED. Garak probe module name (e.g. 'fitd', 'atkgen', 'topic')."
      class_name:
        description: "REQUIRED. Garak probe class name (e.g. 'FITD', 'Tox', 'WordNet')."
      name:
        description: >
          Custom name for the generated test set. Omit for the default
          "Garak Dynamic: <module>.<class>".
      num_tests:
        description: >
          Number of tests to generate (integer, max 500). Omit to let the
          backend pick a random value between 100 and 200.
      model_id:
        description: "Omit. Uses the user's default generation model unless overridden."

  # ── Tests ─────────────────────────────────────────────────
  - name: list_tests
    label: Listing tests
    method: GET
    path: /tests/
    default_query:
      $select: "id,prompt,requirement,category,topic,test_set"
    page_size: 20
    description: >
      List tests in the organization. Each test defines a prompt,
      expected response requirement, and optional metadata. By default
      only core fields are returned. Add fields to $select if needed.
      Prefer list_test_set_tests when scoped to one test set.

  - name: get_test
    label: Retrieving test
    method: GET
    path: /tests/{test_id}
    description: >
      Get one test with full detail including prompt and configuration.
      ENTITY: Test. PREREQUISITES: test_id from list_test_set_tests or
      list_tests. CHAIN: after list_test_set_tests when fixing or
      reviewing a specific prompt; before update_test. NEVER: re-list
      the whole test set when you already have the test id.
    parameters:
      test_id:
        description: "REQUIRED. UUID of the test."

  - name: update_test
    label: Updating test
    method: PUT
    path: /tests/{test_id}
    requires_confirmation: true
    description: >
      Update an existing test's prompt or metadata. ENTITY: Test.
      PREREQUISITES: test_id from list_test_set_tests; call get_test
      first to see current values. CHAIN: use to fix individual bad
      prompts after generate_test_set without regenerating the whole set.
      Send ONLY fields to change. Does NOT replace generate_test_set for
      bulk creation. Do NOT send server-managed fields (id, user_id,
      organization_id, created_at, updated_at).
    parameters:
      test_id:
        description: "REQUIRED. UUID of the test to update."
      prompt:
        description: >
          Optional. Prompt object with content, language_code, and optional
          expected_response. Omit unchanged fields at the test level.
      requirement:
        description: "Requirement name string. Omit to keep unchanged."
      category:
        description: "Category name string. Omit to keep unchanged."
      topic:
        description: "Topic name string. Omit to keep unchanged."
      test_type:
        description: '"Single-Turn" or "Multi-Turn". Omit to keep unchanged.'

  # ── Test Runs ─────────────────────────────────────────────
  - name: list_test_runs
    label: Checking test runs
    method: GET
    path: /test_runs/
    page_size: 20
    description: >
      List test runs in the organization. Each test run tracks one
      execution of a test set. Key fields: id, status, test_set,
      endpoint, created_at, completed_at. Status values: Queued,
      Running, Completed, Failed. Use $select to request only the
      fields you need (e.g. $select=id,status,test_set,created_at).
      Use $filter to narrow results (e.g. $filter=status eq 'Completed').

  - name: get_test_run
    label: Checking test run status
    method: GET
    path: /test_runs/{test_run_id}
    description: >
      Get details of a specific test run including its status, timing,
      test configuration, endpoint, and test set information.
      The attributes field contains summary stats (total_tests,
      execution_mode, started_at). Always use this for accurate
      test counts rather than counting items from list_test_results.

  # ── Test Results ──────────────────────────────────────────
  - name: list_test_results
    label: Retrieving test results
    method: GET
    path: /test_results/
    default_query:
      $select: "id,status,prompt,requirement,metric_scores"
    page_size: 20
    description: >
      List test results. Each result contains the prompt sent, the
      response received, status (Passed/Failed), and evaluation scores.
      Filter by test run: $filter=test_run_id eq '<uuid>'. By default
      only lightweight fields are returned (id, status, prompt, requirement,
      metric_scores). To include the full response text, add 'response'
      to $select explicitly. Key fields: status (Passed/Failed),
      prompt (the input), metric_scores (array of score objects with
      metric name, score, and threshold).

  - name: get_test_result
    label: Retrieving test result
    method: GET
    path: /test_results/{test_result_id}
    description: >
      Get full details of a specific test result. Use this to drill into
      individual failures and understand why a test failed.

      Key fields in the response:
      - test_output.output: the endpoint's actual response text
      - test_metrics.metrics: dict of metric name → evaluation result.
        Each evaluation result contains:
        - is_successful (bool): whether this metric passed
        - score (float or string): the numeric or categorical score
        - reason (string): the evaluator's explanation of why this score
          was given — this is the most useful field for failure analysis
        - threshold (float): the pass/fail threshold (numeric metrics)
      - status: overall pass/fail for this test result

      Use the result IDs from list_test_results (filtered to failures) to
      identify which specific results to drill into. Focus on the 2-3 most
      informative failures rather than fetching every failing result.

  # ── Requirements ─────────────────────────────────────────────
  - name: list_requirements
    label: Looking up requirements
    method: GET
    path: /requirements/
    page_size: 20
    description: >
      List available requirements. Requirements define what an endpoint should
      do (e.g., "answer questions accurately", "refuse harmful requests").
      Use $select to request only the fields you need. CHAIN: resolve
      by name here, then get_requirement for full detail including linked
      metrics.

  - name: get_requirement
    label: Retrieving requirement
    method: GET
    path: /requirements/{requirement_id}
    description: >
      Get one requirement with linked metrics. ENTITY: Requirement ↔ Metric.
      PREREQUISITES: requirement_id from list_requirements. CHAIN: verify
      requirement→metric links from the requirement side; complement
      get_metric_requirements (metric-centric view). Use during planning
      to confirm reuse candidates include the right metrics.
    parameters:
      requirement_id:
        description: "REQUIRED. UUID of the requirement."

  - name: create_requirement
    label: Creating requirement
    method: POST
    path: /requirements/
    requires_confirmation: true
    description: >
      Create a requirement with a name AND description upfront. Use this
      BEFORE create_test_set_bulk so that when test objects reference
      the requirement by name, the server finds the pre-created requirement
      (with its description) instead of auto-creating a description-less
      one. Do NOT send server-managed fields (id, user_id, organization_id,
      created_at, updated_at).
      Requirement names are unique per organization. Creating one that
      already exists fails with "Requirement with this name already exists".
      Call list_requirements first and reuse the existing id — do NOT retry
      with a suffixed name like "Refuses Harmful Requests 2", which
      creates a near-duplicate nobody wants.
    parameters:
      name:
        description: "REQUIRED. Requirement name (string, e.g. 'Refuses harmful requests')."
      description:
        description: "REQUIRED. Explain what this requirement means and how it should be evaluated."
      project_id:
        description: >
          Omit. The project scope is taken from the request, not from
          this field.

  # ── Categories & Topics ───────────────────────────────────
  - name: list_categories
    label: Listing categories
    method: GET
    path: /categories/
    page_size: 20
    description: >
      List available categories. Categories classify tests by type
      (e.g., "functional", "safety", "robustness"). Use $select to
      request only the fields you need.

  - name: list_topics
    label: Listing topics
    method: GET
    path: /topics/
    page_size: 20
    description: >
      List available topics. Topics define subject areas for tests
      (e.g., "healthcare", "finance", "general knowledge"). Use $select
      to request only the fields you need.

  - name: update_requirement
    label: Updating requirement
    method: PUT
    path: /requirements/{requirement_id}
    requires_confirmation: true
    description: >
      Update an existing requirement's fields. Use this to add a description
      to a requirement that was auto-created by create_test_set_bulk (which
      only sets the name). A requirement with a clear description is more
      useful for test planning and metric evaluation.
    parameters:
      requirement_id:
        description: "REQUIRED. UUID of the requirement to update."
      name:
        description: "Requirement name (string). Omit to keep unchanged."
      description:
        description: "Requirement description (string). Explain what this requirement means and how it should be evaluated."

  - name: list_metrics
    label: Checking existing metrics
    method: GET
    path: /metrics/
    default_query:
      $select: "id,name,description,score_type,threshold,metric_scope"
    page_size: 20
    description: >
      List available metrics for evaluating test results. ENTITY: Metric.
      PREREQUISITES: none. CHAIN: resolve by name here, then get_metric
      for full evaluation_prompt before update_metric or improve_metric.
      By default excludes evaluation_prompt — use get_metric for the
      full prompt. Link to requirements via add_requirement_to_metric.

  - name: get_metric
    label: Retrieving metric
    method: GET
    path: /metrics/{metric_id}
    description: >
      Get one metric with full fields including evaluation_prompt.
      ENTITY: Metric. PREREQUISITES: metric_id from list_metrics.
      CHAIN: read before update_metric (precise edits) or improve_metric
      (natural-language refactors). Use get_metric_requirements to see
      linked requirements. NEVER: add evaluation_prompt to list_metrics
      $select on every call — use this tool instead.
    parameters:
      metric_id:
        description: "REQUIRED. UUID of the metric."

  - name: create_metric
    label: Creating metric
    method: POST
    path: /metrics/
    requires_confirmation: true
    description: >
      Create a new evaluation metric. Do NOT send server-managed fields
      (id, user_id, organization_id, created_at, updated_at, owner_id,
      assignee_id, status_id, model_id, backend_type_id, metric_type_id).
      If you only have a natural-language description, prefer
      generate_metric instead.

      ALWAYS send the descriptive fields alongside the scoring
      configuration: description, evaluation_steps, reasoning, and
      explanation. They are optional to the API but a metric without them
      is a poor metric — reviewers cannot tell what it measures, and the
      judge LLM has less to work with, so scores get less consistent.
      Sending only name + evaluation_prompt + score_type produces a
      threadbare metric and is a bug, not a shortcut.

      Depth matters as much as presence. One generic sentence per field is
      the same failure as an empty field: it passes validation and still
      leaves the judge guessing. Aim for description 2-3 sentences,
      evaluation_prompt 6-15 lines (criterion, one bullet per testable
      clause, score bands defined by observable conditions),
      evaluation_steps 4-7 ordered steps, reasoning 3-5 sentences,
      explanation 2-4 sentences. Be specific to this metric — no filler.

      FIELDS REQUIRED BY score_type — the schema cannot express this, so
      read it here. When score_type is "numeric" you MUST also send
      min_score, max_score AND threshold; omitting any one is rejected.
      When score_type is "categorical" you MUST also send categories (at
      least two labels) AND passing_categories (at least one, each of
      which must also appear in categories). Send the numeric fields only
      for numeric metrics and the category fields only for categorical
      ones.

      Metric names are unique per organization. Creating one that already
      exists fails with "Metric with this name already exists". Call
      list_metrics first and reuse the existing id, or use improve_metric
      to change it — do NOT retry with a suffixed name.
    parameters:
      name:
        description: "Metric name, unique within the organization (required, string)"
      project_id:
        description: >
          Omit. The project scope is taken from the request, not from
          this field.
      description:
        description: >
          REQUIRED IN PRACTICE. Two to three sentences for a human scanning
          a list of metrics: what is measured, on what part of the output,
          and why it matters for this system. Do not restate the name.
      evaluation_steps:
        description: >
          REQUIRED IN PRACTICE. 4-7 ordered steps the judge LLM follows to
          reach a score. One observable action per step (locate the
          evidence, check it against the criterion, then map to the score
          — scoring is always the last step); do not restate the criteria.

          FORMAT: "Step N:" on its own line, the step text below it, steps
          separated by a line containing only "---". For example:
          "Step 1:\nIdentify each factual claim in the response.\n---\nStep
          2:\nCheck each claim against the provided context.\n---\nStep
          3:\nCount the unsupported claims.\n---\nStep 4:\nMap that count
          onto the score scale." A plain "1. ... 2. ..." list is stored as
          a single step and renders as one block in the UI.
      reasoning:
        description: >
          REQUIRED IN PRACTICE. 3-5 sentences telling the judge how to
          justify its verdict: which span of the response to quote, which
          criterion clause to tie it to, what to do when the evidence is
          missing, and how to break a tie between two score bands instead
          of drifting to the middle. Surfaced in the UI as "Reasoning
          Instructions".
      explanation:
        description: >
          REQUIRED IN PRACTICE. Two to four sentences on what a passing
          versus failing result means for the system under test, and what
          the reader should do about a fail. Surfaced in the UI as "Result
          Explanation".
      metric_type:
        description: >
          Must be "custom-prompt" for user-defined metrics. Always
          include this field.
      backend_type:
        description: >
          Must be "custom" for user-defined metrics. Always include
          this field.
      score_type:
        description: >
          REQUIRED. Use "numeric" or "categorical". The third value the
          schema still lists, "binary", is legacy and was migrated to
          "categorical" — do not use it. Decides which other fields are
          required; see the conditional rules in this tool's description.
      evaluation_prompt:
        description: >
          REQUIRED. The evaluation criteria the judge applies (string).
          Write it in three parts. First, name something a reader could
          point at in the output, in the vocabulary of the system under
          test ("every claim about coverage limits appears in the retrieved
          policy document", not "the response is helpful"). Then one bullet
          per testable clause, each able to fail on its own. Then score
          bands tied to conditions rather than adverbs ("score 1 when a
          claim contradicts the document", not "score 1 if bad"). Finish
          with what the metric does not cover, so it does not quietly score
          what another metric owns.

          Criteria text ONLY — do NOT include placeholders like {{prompt}}
          or {{response}}. Nothing substitutes them, so the judge would see
          the literal braces. The engine injects the input, response,
          context, metadata and tool calls (Single-Turn) or the full
          transcript and conversation goal (Multi-Turn) before your text.
      metric_scope:
        description: >
          REQUIRED, and rejected if missing or empty. Non-empty list, each
          entry exactly "Single-Turn" or "Multi-Turn". This decides
          which tests the metric is evaluated against: a Single-Turn metric
          is skipped on Multi-Turn tests and vice versa, so a wrong value
          means the metric silently never runs. Use ["Multi-Turn"] for
          conversation-level metrics, ["Single-Turn"] for single
          request-response metrics, and both only when the metric genuinely
          works either way.
      reference_score:
        description: "Deprecated. Omit — use categories instead."
      class_name:
        description: "Omit. Only used by built-in provider-backed metrics."
      ground_truth_required:
        description: >
          Set true only when the metric cannot be scored without the
          test's expected_response. Defaults to false.
      context_required:
        description: >
          Set true only when the metric needs retrieved context to score
          the response. Defaults to false.
      evaluation_examples:
        description: >
          Optional worked examples showing how to score borderline cases.
          Free text; helps the judge stay consistent.
      min_score:
        description: >
          Minimum score value, number. REQUIRED when score_type is
          "numeric"; omit for categorical metrics.
      max_score:
        description: >
          Maximum score value, number. REQUIRED when score_type is
          "numeric"; omit for categorical metrics.
      threshold:
        description: >
          Pass/fail threshold, number. REQUIRED when score_type is
          "numeric"; omit for categorical metrics.
      threshold_operator:
        description: >
          Comparison operator for the threshold. Must be exactly one of:
          "=", "<", ">", "<=", ">=", "!=". Default is ">=".
          Only used for numeric metrics.
      categories:
        description: >
          List of category label strings. REQUIRED when score_type is
          "categorical" and must contain at least two labels; omit for
          numeric metrics.
      passing_categories:
        description: >
          Subset of categories that indicate a pass. REQUIRED when
          score_type is "categorical" and must contain at least one
          string, each of which also appears in "categories"; omit for
          numeric metrics.

  - name: generate_metric
    label: Generating metric
    method: POST
    path: /metrics/generate
    requires_confirmation: true
    description: >
      Auto-generate a complete metric from a natural-language description.
      An LLM produces all required fields (name, evaluation_prompt,
      score_type, thresholds, categories, etc.) and the metric is
      persisted automatically. Use this when you know WHAT to measure
      but don't want to fill every field manually. Returns the created
      metric object.
    parameters:
      prompt:
        description: >
          REQUIRED. Natural-language description of what the metric
          should evaluate (e.g. "measure whether responses are factually
          accurate, on a 1-5 numeric scale").
      project_id:
        description: >
          Omit. The project scope is taken from the request, not from
          this field.

  - name: improve_metric
    label: Improving metric
    method: POST
    path: /metrics/{metric_id}/improve
    requires_confirmation: true
    description: >
      Improve an existing metric using natural-language edit instructions.
      The LLM reads the current metric fields and applies the requested
      changes (e.g. "make the threshold stricter", "add multi-turn
      support"). The metric is updated in place and returned.
    parameters:
      metric_id:
        description: "REQUIRED. UUID of the metric to improve (path parameter)."
      prompt:
        description: >
          REQUIRED. Natural-language instructions describing what to change
          (e.g. "lower the threshold to 2", "switch to categorical with
          pass/fail categories").
      project_id:
        description: >
          Omit. The project scope is taken from the request, not from
          this field.

  - name: update_metric
    label: Updating metric
    method: PUT
    path: /metrics/{metric_id}
    requires_confirmation: true
    description: >
      Update metric fields directly. ENTITY: Metric. PREREQUISITES:
      metric_id from list_metrics; call get_metric first to read current
      values. CHAIN: for precise field edits (threshold, evaluation_prompt).
      Use improve_metric for natural-language refactors. Does NOT change
      requirement links — use add_requirement_to_metric or
      remove_requirement_from_metric for those. Send ONLY fields to change.
      Do NOT send server-managed fields (id, user_id, organization_id,
      created_at, updated_at, owner_id, assignee_id, status_id, model_id,
      backend_type_id, metric_type_id).
    parameters:
      metric_id:
        description: "REQUIRED. UUID of the metric to update."
      name:
        description: "Metric name (string). Omit to keep unchanged."
      description:
        description: "What this metric evaluates (string). Omit to keep."
      evaluation_prompt:
        description: "Evaluation prompt template (string). Omit to keep."
      score_type:
        description: '"numeric" or "categorical". Omit to keep unchanged.'
      threshold:
        description: "Pass/fail threshold (number). Omit to keep unchanged."
      threshold_operator:
        description: 'Comparison operator: "=", "<", ">", "<=", ">=", "!=". Omit to keep.'

  - name: add_requirement_to_metric
    label: Linking requirement to metric
    method: POST
    path: /metrics/{metric_id}/requirements/{requirement_id}
    requires_confirmation: true
    description: >
      Link a requirement to a metric (Requirement ↔ Metric relation).
      ENTITY: Requirement + Metric. PREREQUISITES: both must exist; all
      planned mappings must complete before generate_test_set. CHAIN:
      call after create_metric; verify with get_metric_requirements; undo
      with remove_requirement_from_metric. Idempotent — repeat calls are
      no-ops.
    parameters:
      metric_id:
        description: "REQUIRED. UUID of the metric."
      requirement_id:
        description: "REQUIRED. UUID of the requirement to associate."

  - name: remove_requirement_from_metric
    label: Unlinking requirement from metric
    method: DELETE
    path: /metrics/{metric_id}/requirements/{requirement_id}
    requires_confirmation: true
    description: >
      Remove a requirement-to-metric link. ENTITY: Requirement ↔ Metric.
      PREREQUISITES: metric_id and requirement_id; confirm link exists
      via get_metric_requirements. CHAIN: inverse of add_requirement_to_metric.
      Removing links may block generate_test_set if requirements in the
      plan no longer have metrics.
    parameters:
      metric_id:
        description: "REQUIRED. UUID of the metric."
      requirement_id:
        description: "REQUIRED. UUID of the requirement to unlink."

  - name: get_metric_requirements
    label: Checking metric requirements
    method: GET
    path: /metrics/{metric_id}/requirements/
    page_size: 20
    description: >
      List all requirements currently linked to a metric. Use this to
      verify which requirements a metric evaluates or to check whether a
      specific requirement is already associated before calling
      add_requirement_to_metric.
    parameters:
      metric_id:
        description: "REQUIRED. UUID of the metric."

  - name: list_endpoints
    label: Finding endpoints
    method: GET
    path: /endpoints/
    page_size: 50
    description: >
      List configured endpoints. ENTITY: Endpoint. PREREQUISITES: none.
      CHAIN: resolve by name here, then get_endpoint for full config
      (mappings, auth) or pass id to check_endpoint, explore_endpoint,
      execute_test_set. Use $select=name,id,url,description for browsing.

  - name: get_endpoint
    label: Retrieving endpoint
    method: GET
    path: /endpoints/{endpoint_id}
    description: >
      Get full endpoint configuration including request/response mappings
      and auth settings. ENTITY: Endpoint. PREREQUISITES: endpoint_id
      from list_endpoints. CHAIN: use before update_endpoint or when
      debugging execute_test_set failures. NEVER: rely on list_endpoints
      alone when you need mapping or auth details.
    parameters:
      endpoint_id:
        description: "REQUIRED. UUID of the endpoint."

  - name: create_endpoint
    label: Creating endpoint
    method: POST
    path: /endpoints/
    requires_confirmation: true
    description: >
      Register a new REST API endpoint (an AI system to be tested — a chat
      API, completion API, or chatbot). The endpoint is created in the
      current project automatically — do NOT resolve a project or ask the
      user which one to use. Do NOT send server-managed fields
      (id, user_id, organization_id, status_id, created_at, updated_at).
      After creating, you can verify reachability with check_endpoint.
    parameters:
      name:
        description: "REQUIRED. Endpoint name, unique within the project (string)."
      project_id:
        description: >
          Omit. The project scope is taken from the request, not from this
          field.
      connection_type:
        description: 'Connection protocol. Use "REST" for HTTP APIs (default for chatbots).'
      url:
        description: "REQUIRED for REST. Full endpoint URL, e.g. https://api.example.com/chat."
      method:
        description: 'HTTP method for REST endpoints, e.g. "POST" or "GET".'
      description:
        description: "What the endpoint does (string)."
      environment:
        description: '"production", "staging", "development", or "local". Default: "development".'
      request_headers:
        description: >
          Object of HTTP headers sent with each request, e.g.
          {"Content-Type": "application/json"}.
      request_mapping:
        description: >
          Object mapping the request body, using {{ input }} for the user
          message. e.g. {"message": "{{ input }}"}.
      response_mapping:
        description: >
          Object mapping the response, using JSONPath to extract the output
          field. e.g. {"output": "$.response"}.
      query_params:
        description: "Optional object of query-string parameters."
      response_format:
        description: '"json", "xml", or "text". Default: "json".'
      auth_type:
        description: >
          Authentication scheme: "bearer_token", "client_credentials", or
          "api_key". Omit for unauthenticated endpoints.
      auth_token:
        description: "Bearer token / API key (write-only, stored encrypted)."
      client_id:
        description: "OAuth client id (client_credentials flow)."
      client_secret:
        description: "OAuth client secret (write-only, stored encrypted)."
      token_url:
        description: "OAuth token endpoint URL (client_credentials flow)."
      scopes:
        description: "List of OAuth scope strings (client_credentials flow)."
      audience:
        description: "OAuth audience (client_credentials flow)."

  - name: update_endpoint
    label: Updating endpoint
    method: PUT
    path: /endpoints/{endpoint_id}
    requires_confirmation: true
    description: >
      Update an existing endpoint's configuration. Resolve the endpoint
      FIRST with list_endpoints to obtain its id, then pass that id as
      endpoint_id. Send ONLY the fields you want to change — every field is
      optional and omitted fields keep their current values. Do NOT send
      server-managed fields (id, user_id, organization_id, status_id,
      created_at, updated_at). After updating, you can verify reachability
      with check_endpoint.
    parameters:
      endpoint_id:
        description: "REQUIRED. UUID of the endpoint to update (path parameter)."
      name:
        description: "New endpoint name, unique within the project (string)."
      description:
        description: "What the endpoint does (string)."
      url:
        description: "Full endpoint URL, e.g. https://api.example.com/chat."
      method:
        description: 'HTTP method for REST endpoints, e.g. "POST" or "GET".'
      environment:
        description: '"production", "staging", "development", or "local".'
      request_headers:
        description: >
          Object of HTTP headers sent with each request, e.g.
          {"Content-Type": "application/json"}.
      request_mapping:
        description: >
          Object mapping the request body, using {{ input }} for the user
          message. e.g. {"message": "{{ input }}"}.
      response_mapping:
        description: >
          Object mapping the response, using JSONPath to extract the output
          field. e.g. {"output": "$.response"}.
      query_params:
        description: "Optional object of query-string parameters."
      response_format:
        description: '"json", "xml", or "text".'
      auth_type:
        description: >
          Authentication scheme: "bearer_token", "client_credentials", or
          "api_key".
      auth_token:
        description: "Bearer token / API key (write-only, stored encrypted)."
      client_id:
        description: "OAuth client id (client_credentials flow)."
      client_secret:
        description: "OAuth client secret (write-only, stored encrypted)."
      token_url:
        description: "OAuth token endpoint URL (client_credentials flow)."
      scopes:
        description: "List of OAuth scope strings (client_credentials flow)."
      audience:
        description: "OAuth audience (client_credentials flow)."

  - name: check_endpoint
    label: Checking endpoint connectivity
    method: POST
    path: /endpoints/{endpoint_id}/invoke
    requires_confirmation: false
    description: >
      Send a test message to an endpoint to verify it is reachable and
      responding. Only use this when you are about to act on the endpoint
      (explore, run tests, send a request) — not when simply listing or
      looking up endpoints. Send a simple input like {"input": "hello"}
      and check whether the response is valid. Report any errors to the
      user (e.g. connection refused, timeout, auth failure).
    parameters:
      endpoint_id:
        description: "REQUIRED. UUID of the endpoint to check."
      input:
        description: "A simple test message string (e.g. 'hello')."

  - name: explore_endpoint
    label: Exploring endpoint
    method: POST
    path: /endpoints/{endpoint_id}/explore
    requires_confirmation: true
    description: >
      Run a multi-turn exploration of an endpoint using Penelope to
      discover its domain, capabilities, limits, and response patterns.
      This runs as a background task — the response includes a task_id.
      Poll get_job_status with that task_id until status is "SUCCESS",
      then read the findings from the result field. Typical duration:
      30s–2min for single strategies, 1–3min for "comprehensive".
      Either strategy or goal is required.
    parameters:
      endpoint_id:
        description: "REQUIRED. UUID of the endpoint to explore (path parameter)."
      strategy:
        description: >
          Exploration strategy. One of "domain_probing" (discovers
          domain, purpose, and persona), "capability_mapping" (enumerates
          features and interaction patterns), "boundary_discovery" (finds
          refusal patterns and limits), or "comprehensive" (runs all three
          in sequence). When set, goal and instructions are generated
          automatically. Either strategy or goal is required.
      goal:
        description: >
          What to learn about the endpoint. Required only when no strategy
          is specified. Example: "Understand the endpoint's domain and
          restrictions."
      instructions:
        description: "Optional step-by-step probing instructions."
      scenario:
        description: "Optional persona/context, e.g. 'You are a new user'."
      restrictions:
        description: "Optional constraints to verify during exploration."
      previous_findings:
        description: >
          Optional structured findings from a prior exploration run.
          The strategy uses them to build on earlier results.

  # ── Statistics & Comparison ──────────────────────────────
  - name: get_insights
    label: Analyzing test results and runs
    method: GET
    path: /insights/
    description: >
      Generic aggregation query over test results, metrics, test runs, or
      tests. Always pass entity and measures; group_by is optional (omit
      for one overall total).

      entity="test_result" -- one row per test execution. Use for
      single-run analysis (which requirements/metrics failed?) and multi-run
      comparison (did results improve?).
        group_by: requirement, requirement_id, category, category_id, topic,
        topic_id, test_run, status, year, month.
        measures: count, passed, failed, pass_rate.

      entity="metric" -- one row per (test_result, metric_name); use for
      per-metric breakdowns (Answer Fluency, Contextual Recall, etc.).
        group_by: metric_name, requirement_id, year, month.
        measures: count, passed, failed, pass_rate, automated_passed,
        automated_failed, human_review_count.

      entity="test_run" -- one row per run. Use for operational overview
      (how many runs by status, which test sets are run most often, who
      runs tests, run volume over time), NOT for comparing pass/fail
      outcomes between runs (use entity=test_result for that).
        group_by: status, test_set, executor, year, month.
        measures: count, passed, failed, pass_rate.

      entity="test" -- one row per test, including tests that have never
      run. Use for test-inventory questions (how many tests never ran?).
        group_by: requirement, requirement_id, category, category_id, topic,
        topic_id, is_unrun, year, month.
        measures: count, unrun_count, run_count, passed, failed, pass_rate.

      Examples:
      - Which requirements failed in a run: entity=test_result,
        group_by=[requirement], measures=[count,passed,failed,pass_rate],
        test_run_ids=[<id>]
      - Compare runs side by side: entity=test_result, group_by=[test_run],
        measures=[count,passed,failed,pass_rate], test_run_ids=[<id1>,<id2>]
      - Which metrics are the problem areas: entity=metric,
        group_by=[metric_name], measures=[count,passed,failed,pass_rate],
        test_run_ids=[<id>]
      - Runs by status: entity=test_run, group_by=[status], measures=[count]
      - Most-run test sets: entity=test_run, group_by=[test_set],
        measures=[count]
      - Tests that never ran: entity=test, measures=[count,unrun_count]
      - Lightweight overall total: entity=test_result, group_by=[],
        measures=[count,passed,failed,pass_rate]

      Filter by test_run_ids, requirement_ids, category_ids, topic_ids,
      test_set_ids, endpoint_ids, or tags to narrow the analysis.
    parameters:
      entity:
        description: >
          "test_result", "metric", "test_run", or "test". See description
          for the group_by/measures each supports.
      group_by:
        description: >
          Dimensions to group by (array). See description for the valid
          list per entity. Omit for a single overall row.
      measures:
        description: >
          Measures to compute (array). See description for the valid list
          per entity.
      test_run_ids:
        description: >
          Filter to specific test runs (array of UUIDs). Pass two or
          more run IDs to compare them side by side.
      test_set_ids:
        description: "Filter by test set UUIDs (array)."
      requirement_ids:
        description: "Filter by requirement UUIDs (array)."
      category_ids:
        description: "Filter by category UUIDs (array)."
      topic_ids:
        description: "Filter by topic UUIDs (array)."
      tags:
        description: "Filter by tag names (array)."
      endpoint_ids:
        description: "Filter by endpoint UUIDs (array)."
      months:
        description: "Months of history to include (default: 6)."
      start_date:
        description: "Start date in ISO format (overrides months)."
      end_date:
        description: "End date in ISO format (overrides months)."

  # ── Annotations (human reviews) ──────────────────────────
  - name: list_annotations
    label: Reading annotations
    method: GET
    path: /annotations/
    page_size: 20
    description: >
      List human annotations — reviews a person left on a test result or on
      a trace. Each annotation carries a Pass/Fail rating in status.name, a
      free-text comment, who wrote it, and a resolved flag. This is ground
      truth from a human, so it outranks automated metric scores when the
      two disagree.

      Use this to answer "what did people flag?", to explain why a test is
      considered wrong when metrics say it passed, and to find work that is
      still open. Pass resolved=false for open items only.

      Scoping:
      - test_run_id: everything reviewed in that run — both the run's test
        results and the traces it produced. This is the main entry point.
      - test_result_id: one result plus traces linked to it.
      - trace_id (32-char OpenTelemetry hex id) or trace_db_id (internal
        UUID): one trace only. Use whichever id you already have; both are
        returned on every trace annotation.
      - source: restrict to "test_result" or "trace" when you want one side.

      Key response fields: comments (the human's actual words),
      status.name (Pass/Fail), resolved, target.type (what was reviewed —
      test_result, trace, metric, or turn), plus requirement_name and the
      test_run_id/test_result_id/trace_id deep-link ids. Annotations on a
      test-execution trace carry the run and result ids too, so you can
      walk from a trace review back to the run — they are null only for
      traces recorded outside a test run.

      When linking to a trace in the UI, use trace_db_id (a UUID) in the
      URL path, not trace_id (a 32-char hex string). Only trace_db_id
      resolves to a trace page.

      CHAIN: after get_insights shows failures, call this with the
      same test_run_id to see whether a human already diagnosed them — then
      use get_test_result on the ids it returns to read the full exchange.
      NEVER: assume no annotations exist because a run looks clean; a human
      can fail a test the metrics passed.
    parameters:
      search:
        description: >
          Free-text search across comments, annotator name, target
          reference, rating, and requirement name.
      resolved:
        description: >
          true for resolved reviews, false for still-open ones. Omit for
          both.
      rating:
        description: >
          "Pass" or "Fail" — the human's verdict, independent of the
          automated status on the test result.
      target_type:
        description: >
          What the review is attached to: "test_result", "trace", "metric"
          (a specific metric on a result), or "turn" (one turn of a
          conversation).

  # ── Knowledge Sources ────────────────────────────────────
  - name: list_sources
    label: Listing knowledge sources
    method: GET
    path: /sources/
    page_size: 50
    default_query:
      $select: "id,title,description,url,source_type_id,status_id,organization_id,user_id"
    description: >
      Discover available knowledge sources by title and description.
      Use this when the user mentions documentation, reference material,
      or says things like "based on our FAQ", "use the product spec",
      "I have reference material". Search by name with
      $filter=contains(tolower(title), 'keyword'). The agent should
      NEVER fetch source content — pass IDs directly to generate_test_set
      and the backend handles content injection. CHAIN: if no match,
      create_source then pass new id to generate_test_set (Single-Turn only).
    parameters:
      filter:
        description: >
          OData filter expression to search by title or description, e.g.
          $filter=contains(tolower(title), 'keyword').

  - name: create_source
    label: Creating knowledge source
    method: POST
    path: /sources/
    requires_confirmation: true
    description: >
      Create a knowledge source for grounding test generation. ENTITY: Source.
      PREREQUISITES: copy source_type_id from list_sources (same type) or
      from an existing source of that type. CHAIN: after create, pass
      [{"id": "<uuid>"}] to generate_test_set sources (Single-Turn only).
      For pasted text: title + content (Manual type). For URLs: title + url
      (Website type). NEVER fetch or pass raw content to generate_test_set —
      only the ID. File uploads require the UI (POST /sources/upload not
      available via MCP). Do NOT send server-managed fields (id, user_id,
      organization_id, created_at, updated_at).
    parameters:
      title:
        description: "REQUIRED. Source title (string)."
      description:
        description: "Optional description of the source (string)."
      project_id:
        description: >
          Omit. The project scope is taken from the request, not from
          this field.
      content:
        description: >
          Raw text content for Manual-type sources. Use when the user
          pasted reference material in chat — create a source instead of
          embedding text in generate_test_set.
      url:
        description: >
          URL for Website-type sources (must start with http:// or https://).
          Backend extracts content automatically.
      source_type_id:
        description: >
          REQUIRED. UUID of the source type. Copy from list_sources on an
          existing source of the same type (check source_type_id field).
      source_metadata:
        description: "Omit. Free-form storage, not used by test generation."

  # ── Tags ────────────────────────────────────────────────
  - name: list_tags
    label: Listing tags
    method: GET
    path: /tags/
    page_size: 50
    description: >
      List organization tags. Use before assigning tags to requirements or
      metrics so you reuse existing names (safety, compliance, functional,
      domain, etc.) instead of inventing duplicates.
    default_query:
      $select: "id,name"

  - name: assign_tag
    label: Assigning tag
    method: POST
    path: /tags/{entity_type}/{entity_id}
    requires_confirmation: true
    description: >
      Assign a tag to a requirement or metric. Creates the tag if it does not
      exist. POST body is JSON: {"name": "safety"} — only `name` is required
      in the body; `entity_type` and `entity_id` are path parameters. Call
      after create_requirement or create_metric to group entities by theme
      (safety, compliance, functional, domain, transparency).
      ENTITY: Tag ↔ Requirement/Metric.
    parameters:
      entity_type:
        description: >
          REQUIRED path parameter. Must be exactly "Requirement" or "Metric"
          (case-sensitive Enum values).
      entity_id:
        description: "REQUIRED path parameter. UUID of the requirement or metric."
      name:
        description: >
          REQUIRED JSON body field (not a query param). Tag name string,
          e.g. {"name": "safety"}. Reuse names from list_tags when possible.

  # ── Background Jobs ─────────────────────────────────────
  - name: get_job_status
    label: Checking job status
    method: GET
    path: /jobs/{task_id}
    requires_confirmation: false
    description: >
      Check the status of a background job. Poll this endpoint until
      the status is "SUCCESS" or "FAILURE". Status values: PENDING →
      STARTED → PROGRESS → SUCCESS (or FAILURE). When SUCCESS, the
      "result" field contains job-specific data:
      - explore_endpoint: full exploration findings including domain,
        capabilities, limits, conversation summary, and strategy_findings.
      - generate_test_set: "test_set_id" — then call get_test_set and
        list_test_set_tests to verify before offering execute_test_set.
      - execute_test_set: use the test_run_id from the original response.
      If FAILURE, the "error" field describes what went wrong.
    parameters:
      task_id:
        description: >
          REQUIRED. The task ID returned by explore_endpoint,
          generate_test_set, or execute_test_set (path parameter).
