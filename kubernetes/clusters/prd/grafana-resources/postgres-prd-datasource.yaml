# Read-only Postgres datasource for production dashboards. "grafana-viewer" (see
# cnpg-cluster.yaml managed.roles) only has SELECT granted on public schema tables, and
# rhesis-prd-ro routes to the hot-standby replica, so this cannot write to prd data.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: rhesis-prd-postgres
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: "Rhesis PRD Postgres (RO)"
    type: postgres
    access: proxy
    url: rhesis-prd-ro.rhesis.svc:5432
    user: grafana-viewer
    jsonData:
      database: rhesis-prd-db
      sslmode: disable
      postgresVersion: 1700
    # Placeholder the operator substitutes the secret into. valuesFrom below cannot
    # create this field on its own: it replaces into an existing value, and silently
    # drops the secret when the target path is absent, while still reporting
    # ApplySuccessful. Without it Grafana stores no password and every query fails
    # authentication. See grafana/grafana-operator#2271 and #2945.
    secureJsonData:
      password: ${password}
    editable: false
  valuesFrom:
    - targetPath: "secureJsonData.password"
      valueFrom:
        secretKeyRef:
          name: grafana-viewer-credentials
          key: password
