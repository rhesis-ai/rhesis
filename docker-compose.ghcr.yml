# Override for ./rh start (default): use prebuilt images from GHCR instead of local builds.
# Images are published per release by .github/workflows/publish-ghcr-images.yml.
#
# The tag is this release's version, written here by the release tool, so a release tag's
# compose files always name that release's images. Run it from a release tag
# (git checkout v<version>), not from main: main's config can be ahead of the last release.
# RHESIS_VERSION overrides it, e.g. to try another release's images.
services:
  backend:
    image: ghcr.io/rhesis-ai/backend:${RHESIS_VERSION:-0.21.2}
    build: !reset null

  worker:
    image: ghcr.io/rhesis-ai/worker:${RHESIS_VERSION:-0.21.2}
    build: !reset null

  beat:
    image: ghcr.io/rhesis-ai/worker:${RHESIS_VERSION:-0.21.2}
    build: !reset null

  frontend:
    image: ghcr.io/rhesis-ai/frontend:${RHESIS_VERSION:-0.21.2}
    build: !reset null
