# CloudNativePG cluster shared by every environment. Each overlay under
# kubernetes/clusters/<env>/cnpg-cluster patches in its name, size, database
# names and backup target; everything here is the same in all of them.
#
# Roles: rhesis-admin (BYPASSRLS, owner, runs migrations), rhesis-user (DML only,
# the app), rhesis-analytics-user (owns the analytics DB), grafana-viewer (SELECT).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-cluster
  namespace: rhesis
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4-1
  postgresql:
    parameters:
      # pg_stat_statements is a CNPG "managed extension": any pg_stat_statements.*
      # parameter makes the operator add it to shared_preload_libraries and run
      # CREATE EXTENSION in every database. Do not set shared_preload_libraries
      # here; the operator owns it. Adding a preload library restarts every
      # instance (a switchover on the primary), so sync this at a quiet hour.
      pg_stat_statements.track: "all"
  # Metrics scrape: cnpg-podmonitor.yaml in each overlay (spec.monitoring.
  # enablePodMonitor is deprecated upstream, so the PodMonitor is explicit).
  managed:
    roles:
      - name: rhesis-admin
        ensure: present
        login: true
        bypassrls: true
        passwordSecret:
          name: rhesis-admin-credentials
      - name: rhesis-user
        ensure: present
        login: true
        bypassrls: false
        passwordSecret:
          name: rhesis-user-credentials
      - name: rhesis-analytics-user
        ensure: present
        login: true
        bypassrls: false
        passwordSecret:
          name: rhesis-analytics-user-credentials
      # The analytics DB is deliberately not granted to this role beyond CONNECT. Its
      # tables do not exist at bootstrap (the telemetry-processor's Alembic chain creates
      # them) and they are owned by rhesis-analytics-user, so only that role can grant on
      # them. Its migration 002 does exactly that, which also covers tables added by later
      # revisions. CNPG could not express it anyway: postInitApplicationSQL reaches only
      # the application database, and a second database cannot be reached from any hook.
      - name: grafana-viewer
        ensure: present
        login: true
        # bypassrls: this role backs an org-wide usage dashboard in Grafana, so it
        # needs to read across every tenant rather than being scoped to one
        # organization via app.current_organization/app.current_project. Still
        # SELECT-only (see postInitApplicationSQL below): read access, no writes.
        bypassrls: true
        passwordSecret:
          name: grafana-viewer-credentials
  # Bootstrap SQL runs once, on a fresh initdb (new environment, or DR restore
  # without a Barman backup). Editing it does nothing to a running cluster; apply
  # the same change by hand there.
  bootstrap:
    initdb:
      # database: set per overlay.
      owner: rhesis-admin
      # Runs as superuser in the postgres DB, before the application DB exists.
      # The roles are created here because CREATE DATABASE ... OWNER needs them now;
      # spec.managed.roles adopts them afterwards and sets passwords and BYPASSRLS.
      # Entries 3-5 get the overlay's analytics DB name between their first pair of
      # double quotes (kustomize replacements), so keep them at these positions.
      postInitSQL:
        - CREATE ROLE "rhesis-analytics-user" WITH LOGIN;
        - CREATE ROLE "rhesis-user" WITH LOGIN;
        - CREATE ROLE "grafana-viewer" WITH LOGIN;
        - CREATE DATABASE "ANALYTICS_DB" OWNER "rhesis-analytics-user";
        - GRANT CONNECT ON DATABASE "ANALYTICS_DB" TO "rhesis-admin";
        - GRANT CONNECT ON DATABASE "ANALYTICS_DB" TO "grafana-viewer";
      # Runs as superuser inside the application DB after initdb creates it.
      postInitApplicationSQL:
        - GRANT ALL ON SCHEMA public TO "rhesis-admin";
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
        - DO $$ BEGIN EXECUTE format('GRANT CONNECT ON DATABASE %I TO "rhesis-user", "grafana-viewer"', current_database()); END; $$;
        - GRANT USAGE ON SCHEMA public TO "rhesis-user";
        - GRANT SELECT, INSERT, UPDATE, DELETE, REFERENCES ON ALL TABLES IN SCHEMA public TO "rhesis-user";
        - GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO "rhesis-user";
        - ALTER DEFAULT PRIVILEGES FOR ROLE "rhesis-admin" IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE, REFERENCES ON TABLES TO "rhesis-user";
        - ALTER DEFAULT PRIVILEGES FOR ROLE "rhesis-admin" IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO "rhesis-user";
        - GRANT USAGE ON SCHEMA public TO "grafana-viewer";
        - GRANT SELECT ON ALL TABLES IN SCHEMA public TO "grafana-viewer";
        - ALTER DEFAULT PRIVILEGES FOR ROLE "rhesis-admin" IN SCHEMA public GRANT SELECT ON TABLES TO "grafana-viewer";
  backup:
    barmanObjectStore:
      googleCredentials:
        gkeEnvironment: true
