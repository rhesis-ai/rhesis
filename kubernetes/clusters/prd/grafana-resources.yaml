apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd-grafana-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://github.com/rhesis-ai/rhesis.git
    targetRevision: e6bc068019f548699f3daf3b9f78adfec5c1328e
    path: kubernetes/clusters/prd/grafana-resources
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
