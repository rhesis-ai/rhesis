apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd-cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rhesis-ai/rhesis.git
    targetRevision: ac8e9ffde075996f8d6f675e25646a34958be543
    path: kubernetes/clusters/prd/cert-manager
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
