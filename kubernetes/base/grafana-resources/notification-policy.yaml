apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicy
metadata:
  name: default-notification-policy
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  route:
    receiver: default-notifications
    group_by:
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Licensing reminders (licensing-alerts.yaml) are business follow-ups, not
      # incidents: same receiver, but once a day is enough.
      - receiver: default-notifications
        object_matchers:
          - ["category", "=", "licensing"]
        group_by:
          - alertname
          - customer
        repeat_interval: 24h
