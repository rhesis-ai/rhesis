# Credentials of the rhesis-enterprise role, owner of the Rhesis Enterprise licensing
# registry DB, synced into both namespaces rhesis-ee's Jobs run in: "rhesis"
# (license issuance and backfill, gated identity) and "rhesis-enterprise"
# (registry bookkeeping). Same shape as stg/prd. Wave 5, like rhesis-app-secrets.yaml:
# after the ClusterSecretStore.
#
# dev runs Bitnami Postgres, not CNPG, so nothing creates the role or database from
# this Secret. After creating GSM secret dev-rhesis-enterprise-password, create them
# once by hand as the postgres superuser (see rhesis-ee's README, "Setup"):
#   CREATE ROLE "rhesis-enterprise" LOGIN PASSWORD '<the GSM value>';
#   CREATE DATABASE "rhesis-enterprise" OWNER "rhesis-enterprise";
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rhesis-enterprise-credentials
  namespace: rhesis
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: rhesis-enterprise-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: rhesis-enterprise
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: dev-rhesis-enterprise-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rhesis-enterprise-credentials
  namespace: rhesis-enterprise
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: rhesis-enterprise-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: rhesis-enterprise
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: dev-rhesis-enterprise-password
