apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/rhesis-ai/rhesis.git
    targetRevision: d8cf2dca8c6e4a564d1282bad24c753c33e3480a
    path: kubernetes/clusters/prd/loki
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
