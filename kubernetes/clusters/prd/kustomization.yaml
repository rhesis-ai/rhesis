# Explicit list of resources synced by prd-base Application.
# Add new components here so the sync contract is auditable.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # The root Application (prd-base) is NOT here, and has no base.yaml in this
  # directory at all — unlike dev/stg. It lives in kubernetes/bootstrap/prd-base.yaml
  # because its targetRevision is an imperative SHA pin set by publish-release.yml,
  # which a self-managed manifest would revert on every sync. See kubernetes/README.md.
  - argocd/argocd-application.yaml
  - argocd/argocd-ingress.yaml
  - external-secrets.yaml
  - external-dns.yaml
  - cert-manager.yaml
  - ingress-nginx-external.yaml
  - ingress-nginx-internal.yaml
  - internal-dns.yaml
  - cluster-dns-application.yaml
  - cnpg-operator.yaml
  # Monitoring stack (sync-wave on each wrapper defers grafana-resources until CRDs exist)
  - grafana-operator.yaml
  - kube-prometheus-stack.yaml
  - volumesnapshotclass.yaml
  - loki.yaml
  - alloy.yaml
  - grafana-resources.yaml
  - rhesis/namespace.yaml
  # DB cluster: dedicated Application (sync-wave 5) waits for CNPG operator CRDs
  - cnpg-cluster-application.yaml
  # rhesis-app-secrets: see clusters/prd/external-secrets/rhesis-app-secrets.yaml
  - rhesis/rhesis-application.yaml
  # RBAC for rhesis-ee's license-issue.yml workflow (arc-runner-prd -> one-off Jobs here)
  - rhesis/license-issuer-rbac.yaml
  # ARC self-hosted runner: gives deploy jobs VPC-internal access to ArgoCD
  - arc.yaml
