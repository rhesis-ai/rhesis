# Read-only Postgres datasource for staging dashboards. "grafana-viewer" (see
# cnpg-cluster.yaml managed.roles) only has SELECT granted on public schema tables.
# Uses rhesis-stg-rw, not rhesis-stg-ro: stg runs a single CNPG instance (no replica),
# and CNPG's -ro service only routes to pods labeled "replica" — with none, it has zero
# endpoints and refuses every connection. The SELECT-only grant is what enforces
# read-only here, not replica routing (unlike prd, which has a physical hot-standby).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: rhesis-stg-postgres
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: "Rhesis STG Postgres (RW)"
    type: postgres
    access: proxy
    url: rhesis-stg-rw.rhesis.svc:5432
    user: grafana-viewer
    jsonData:
      database: rhesis-stg-db
      sslmode: disable
      postgresVersion: 1700
    # Placeholder the operator substitutes the secret into. valuesFrom below cannot
    # create this field on its own: it replaces into an existing value, and silently
    # drops the secret when the target path is absent, while still reporting
    # ApplySuccessful. Without it Grafana stores no password and every query fails
    # authentication. See grafana/grafana-operator#2271 and #2945.
    secureJsonData:
      password: ${password}
    editable: false
  valuesFrom:
    - targetPath: "secureJsonData.password"
      valueFrom:
        secretKeyRef:
          name: grafana-viewer-credentials
          key: password
