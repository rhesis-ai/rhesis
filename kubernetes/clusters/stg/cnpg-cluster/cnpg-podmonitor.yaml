# Scrapes the CNPG instance exporter (port "metrics", 9187) on every instance of
# rhesis-stg. Explicit instead of spec.monitoring.enablePodMonitor, which CNPG
# has deprecated. Prometheus runs with podMonitorSelectorNilUsesHelmValues:
# false, so a PodMonitor in this namespace is picked up without extra labels.
# Series carry namespace/pod/container from the target, not the pod's own
# cnpg.io/* labels; filter by namespace in queries.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: rhesis-stg
  namespace: rhesis
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: rhesis-stg
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
