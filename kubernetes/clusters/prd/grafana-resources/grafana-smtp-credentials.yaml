# Reuses the same GSM keys as external-secrets/rhesis-app-secrets.yaml (SMTP_HOST,
# SMTP_USER, SMTP_PASSWORD, FROM_EMAIL) so Grafana can send alert emails without a
# separate SMTP account. Synced separately into monitoring since a Secret can't be
# read across namespaces. Port isn't a secret (the app defaults SMTP_PORT to 587 and
# has no per-env override), so it's appended here rather than stored in GSM.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-smtp-credentials
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: grafana-smtp-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        host: "{{ .host }}:587"
        user: "{{ .user }}"
        password: "{{ .password }}"
        from: "{{ .from }}"
  data:
    - secretKey: host
      remoteRef:
        key: prd-rhesis-smtp-host
    - secretKey: user
      remoteRef:
        key: prd-rhesis-smtp-user
    - secretKey: password
      remoteRef:
        key: prd-rhesis-smtp-password
    - secretKey: from
      remoteRef:
        key: prd-rhesis-from-email
