name: "[Release] 3. Publish and deploy (prd)"
on:
  workflow_dispatch:  # Allows manual triggering

jobs:
  backend-deploy:
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/backend.yml
    with:
      environment: prd
      reason: "Release deployment to prd"
    secrets: inherit

  frontend-deploy:
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/frontend.yml
    with:
      environment: prd
      reason: "Release deployment to prd"
    secrets: inherit

  worker-deploy:
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/worker.yml
    with:
      environment: prd
      reason: "Release deployment to prd"
    secrets: inherit

  # Promotes every prd ArgoCD Application (root prd-base and its nested apps) to
  # this release's exact commit. targetRevision is pinned to a commit SHA (see
  # kubernetes/clusters/prd/base.yaml), not the release branch, so it survives
  # the branch being deleted on merge and never picks up unrelated main changes
  # until the next release runs this job.
  promote-prd-config:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: arc-runner-prd
    permissions:
      contents: none
    steps:
      - name: Install ArgoCD CLI
        run: |
          ARGOCD_VERSION="v2.14.4"
          ARGOCD_SHA256="ed774771701f8e5a9330918e4f905f2f171e2181906aec792c9ff6907a4c480f"
          mkdir -p "$HOME/bin"
          curl -sSL -o "$HOME/bin/argocd" \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
          echo "${ARGOCD_SHA256}  $HOME/bin/argocd" | sha256sum -c -
          chmod +x "$HOME/bin/argocd"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Pin every prd Application to this release's commit and sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER_PRD }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN_PRD }}
        run: |
          # Retry up to 5 times with 30s back-off: `argocd app set`/`app sync` can
          # transiently fail with "another operation is already in progress" if
          # an app's own selfHeal reconcile is mid-flight when this runs (observed
          # in testing against stg) — not caught by the concurrency group above.
          retry_argocd() {
            for attempt in $(seq 1 5); do
              EXIT_CODE=0
              OUTPUT=$("$@" 2>&1) || EXIT_CODE=$?
              echo "$OUTPUT"
              [ "$EXIT_CODE" -eq 0 ] && return 0
              if ! echo "$OUTPUT" | grep -qi "another operation"; then
                echo "Non-retryable error — failing fast."
                return 1
              fi
              if [ "$attempt" -lt 5 ]; then
                echo "Attempt $attempt failed (concurrent operation) — waiting 30s before retry..."
                sleep 30
              else
                echo "All 5 attempts failed."
                return 1
              fi
            done
          }

          # Set/sync every app explicitly rather than relying on prd-base's sync to
          # cascade the new revision to its children: prd-base's own git state (at
          # $GITHUB_SHA) still carries whatever targetRevision was last committed,
          # so applying it alone would leave children pinned to the previous
          # release. prd-base first (root app-of-apps), then every nested app it
          # manages. cnpg-operator is intentionally excluded — manual sync, manual
          # promotion (see kubernetes/README.md).
          APPS=(
            prd-base
            prd-arc
            prd-loki
            prd-kube-prometheus-stack
            prd-external-secrets
            prd-ingress-nginx-external
            prd-grafana-operator
            prd-cnpg-cluster
            prd-cert-manager
            prd-ingress-nginx-internal
            prd-internal-dns
            prd-grafana-resources
            prd-alloy
            prd-cluster-dns
            prd-external-dns
            argocd
            rhesis
          )

          for app in "${APPS[@]}"; do
            retry_argocd argocd app set "$app" --revision "$GITHUB_SHA" \
              --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web
            retry_argocd argocd app sync "$app" \
              --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web --timeout 300
          done

      # Writes the promoted SHA back to git so the checked-in manifests match what
      # was just synced above — this is what keeps disaster recovery correct (a
      # `kubectl apply` of these files, see kubernetes/README.md) and what prd-base's
      # own selfHeal will treat as desired state on its next reconcile. It does not
      # itself perform the promotion (the explicit set/sync above does); run this
      # promptly after so prd-base's selfHeal doesn't revert the live overrides
      # before git catches up. The one documented exception is cnpg-operator.yaml,
      # which has automated sync disabled on purpose (see kubernetes/README.md) and
      # is promoted manually.
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RHEO_APP_ID }}
          private-key: ${{ secrets.RHEO_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ steps.generate-token.outputs.token }}

      - name: Update prd Application targetRevisions on main
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          git config user.name "rheo-app[bot]"
          git config user.email "237771051+rheo-app[bot]@users.noreply.github.com"

          # cnpg-operator.yaml is intentionally excluded — manual sync, manual promotion.
          FILES=(
            kubernetes/clusters/prd/base.yaml
            kubernetes/clusters/prd/arc.yaml
            kubernetes/clusters/prd/loki.yaml
            kubernetes/clusters/prd/kube-prometheus-stack.yaml
            kubernetes/clusters/prd/external-secrets.yaml
            kubernetes/clusters/prd/ingress-nginx-external.yaml
            kubernetes/clusters/prd/grafana-operator.yaml
            kubernetes/clusters/prd/cnpg-cluster-application.yaml
            kubernetes/clusters/prd/cert-manager.yaml
            kubernetes/clusters/prd/ingress-nginx-internal.yaml
            kubernetes/clusters/prd/internal-dns.yaml
            kubernetes/clusters/prd/grafana-resources.yaml
            kubernetes/clusters/prd/alloy.yaml
            kubernetes/clusters/prd/cluster-dns-application.yaml
            kubernetes/clusters/prd/external-dns.yaml
            kubernetes/clusters/prd/argocd/argocd-application.yaml
            kubernetes/clusters/prd/rhesis/rhesis-application.yaml
          )

          for f in "${FILES[@]}"; do
            sed -i "s|targetRevision: .*|targetRevision: $GITHUB_SHA|" "$f"
          done

          if git diff --quiet -- "${FILES[@]}"; then
            echo "All prd Applications already pinned to $GITHUB_SHA — nothing to commit."
            exit 0
          fi

          git add "${FILES[@]}"
          git commit -m "chore(prd): pin prd Application targetRevisions to $GITHUB_SHA"

          # main can advance between the checkout above and this push; retry on
          # non-fast-forward by rebasing onto the new tip.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          echo "Push failed after 3 attempts."
          exit 1

  publish:
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: [backend-deploy, frontend-deploy, worker-deploy, promote-prd-config]
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RHEO_APP_ID }}
          private-key: ${{ secrets.RHEO_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Git
        run: |
            git config user.name "rheo-app[bot]"
            git config user.email "237771051+rheo-app[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install uv for SDK
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
            version: latest

      - name: Run publish script
        run: |
          python3 .github/release --publish

        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Close release PR and merge to main
        run: |
          gh pr merge --merge
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
