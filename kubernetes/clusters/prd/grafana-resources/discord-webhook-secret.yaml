# Discord incoming webhook URL for Grafana alert notifications. Per-cluster (like
# grafana-viewer-credentials.yaml) so each env can point at its own Discord channel;
# the GrafanaContactPoint that consumes it lives in base/grafana-resources.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-discord-webhook
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: grafana-discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: prd-grafana-discord-webhook
