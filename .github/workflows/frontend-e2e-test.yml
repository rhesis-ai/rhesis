name: "[Test] Frontend E2E"

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'tests/docker-compose.frontend.yml'
      - '.github/workflows/frontend-e2e-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'tests/docker-compose.frontend.yml'
      - '.github/workflows/frontend-e2e-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel only on PR branches. Two merges landing close together share one group
  # on main, and cancelling there leaves the earlier commit with no test verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build backend test image
        run: docker compose -f ../../tests/docker-compose.frontend.yml build frontend-test-backend
        working-directory: apps/frontend

      - name: Save backend image
        run: |
          docker images rhesis-frontend-e2e-backend:ci
          docker save rhesis-frontend-e2e-backend:ci | gzip > frontend-e2e-backend-image.tar.gz
          ls -lh frontend-e2e-backend-image.tar.gz
        working-directory: apps/frontend

      - name: Upload backend image
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-backend-image
          path: apps/frontend/frontend-e2e-backend-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  e2e:
    needs: prepare-docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: make install
        working-directory: apps/frontend

      - name: Get Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
        working-directory: apps/frontend

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}

      # The runner image already ships every library Chromium needs; --with-deps
      # only added fallback fonts, and its apt-get is what broke whenever the
      # Ubuntu mirrors did (runner-images #14823, #15296).
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: npx playwright install chromium
        working-directory: apps/frontend

      # Only reached if a future runner image drops a library Chromium links to.
      - name: Install missing Chromium system libraries
        timeout-minutes: 8
        run: |
          binaries=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \))
          if [ -z "$binaries" ]; then
            echo "No Chromium binaries found under ~/.cache/ms-playwright" >&2
            exit 1
          fi
          missing=$(echo "$binaries" | xargs -d '\n' ldd | grep 'not found' || true)
          if [ -z "$missing" ]; then
            echo "All Chromium libraries present; skipping apt."
            exit 0
          fi
          echo "$missing"
          for attempt in 1 2; do
            timeout 180 npx playwright install-deps chromium && exit 0
            status=$?
            [ "$status" -eq 124 ] && reason="timed out after 180s" || reason="exit $status"
            echo "install-deps attempt $attempt failed ($reason)"
          done
          exit 1
        working-directory: apps/frontend

      - name: Download backend image
        uses: actions/download-artifact@v8
        with:
          name: frontend-e2e-backend-image
          path: apps/frontend

      - name: Load backend image
        run: |
          gunzip -c frontend-e2e-backend-image.tar.gz | docker load
          docker images rhesis-frontend-e2e-backend:ci
        working-directory: apps/frontend

      - name: Run E2E tests (shard ${{ matrix.shard }}/3)
        run: make test-e2e-ci-no-build
        working-directory: apps/frontend
        env:
          PLAYWRIGHT_SHARD: "${{ matrix.shard }}/3"

      - name: Stop Docker services
        if: always()
        run: |
          docker compose -f ../../tests/docker-compose.frontend.yml logs frontend-test-backend
          make docker-down
        working-directory: apps/frontend

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/frontend/blob-report/
          retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: make install
        working-directory: apps/frontend

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: apps/frontend/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
        working-directory: apps/frontend

      - name: Upload merged Playwright report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 14
