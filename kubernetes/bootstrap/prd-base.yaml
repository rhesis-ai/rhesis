apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd-base
  namespace: argocd
  annotations:
    # prd-base is not part of any synced tree, so ArgoCD sees it as a live
    # resource it once tracked but no longer finds in git, and prune deletes it.
    # This survived only because the annotation is read off the live object when
    # there is no target manifest. Do not remove it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  source:
    repoURL: https://github.com/rhesis-ai/rhesis.git
    # Bootstrap value only. publish-release.yml overwrites the live pin with
    # `argocd app set --revision <write-back commit>` on every release, and
    # rewrites this line so a disaster-recovery apply lands on the latest
    # promoted commit rather than a stale one.
    targetRevision: d8cf2dca8c6e4a564d1282bad24c753c33e3480a
    path: kubernetes/clusters/prd
  destination:
    server: https://kubernetes.default.svc
  # The rhesis Application's chart revision is set by the deploy (deploy-all-k8s.yml
  # → k8s-deploy.yml), in the same write as its image tags, so the chart and the
  # images it was released with change together. Without this, selfHeal would put
  # back the targetRevision from git.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: rhesis
      namespace: argocd
      jsonPointers:
        - /spec/source/targetRevision
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - RespectIgnoreDifferences=true
