apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd-ingress-nginx-internal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rhesis-ai/rhesis.git
    targetRevision: ca21e3cd01664a3278f9a060402daeb7f046807b
    path: kubernetes/clusters/prd/ingress-nginx-internal
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
