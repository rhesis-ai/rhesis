apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: default-notifications
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  name: default-notifications
  receivers:
    - type: discord
      settings:
        use_discord_username: true
      valuesFrom:
        - targetPath: url
          valueFrom:
            secretKeyRef:
              name: grafana-discord-webhook
              key: url
    - type: email
      # Filled in by kustomize from the grafana-alert-email ConfigMap (see
      # kustomization.yaml) so it's defined once, not duplicated with grafana-instance.yaml.
      settings:
        addresses: PLACEHOLDER
