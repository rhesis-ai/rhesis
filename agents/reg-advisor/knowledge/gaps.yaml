  - id: "notified-body-ai-designation"
    title: "Notified body AI Act designation gap"
    confidence: "medium"
    citation_unverified: false
    node_ids: ["EU-AI-HIGHRISK-006", "EU-MD-CONF-NB", "EU-IVD-CONF-NB"]
    summary: "AI Act Art. 43(3) integrates conformity assessment through the sectoral MDR or IVDR procedure using the same notified body, provided that body is also notified under the AI Act. Few bodies hold dual designation as of mid-2026, and how integrated assessment works in practice is contested. Harmonised AI standards from CEN-CENELEC JTC 21 are not expected complete before around end-2026."
    action: "Confirm dual-designated notified body availability before committing to an EU-first launch for an AI-enabled device."

