version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"

python:
  install:
    - requirements: docs/sphinx/requirements.txt
    # autodoc imports every SDK package, so it needs the [all] extra
    - method: pip
      path: sdk
      extra_requirements:
        - all

sphinx:
  configuration: docs/sphinx/source/conf.py
