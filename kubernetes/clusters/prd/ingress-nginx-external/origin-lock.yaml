# Origin lock: the external LoadBalancer admits only Cloudflare's edge, so nobody can
# skip the proxy by hitting 35.204.51.66 directly. GKE copies these ranges into its
# k8s-fw-* allow rule. Every host on the external class must stay proxied
# (cloudflare-proxied in charts/rhesis/values-prd.yaml) or it becomes unreachable.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-external
  namespace: argocd
spec:
  source:
    helm:
      valuesObject:
        controller:
          service:
            loadBalancerSourceRanges:
              # IPv4 only: the VPC is single-stack. Kept current by
              # scripts/refresh-cloudflare-ips.py.
              # cloudflare-ips:begin list-v4
              - 103.21.244.0/22
              - 103.22.200.0/22
              - 103.31.4.0/22
              - 104.16.0.0/13
              - 104.24.0.0/14
              - 108.162.192.0/18
              - 131.0.72.0/22
              - 141.101.64.0/18
              - 162.158.0.0/15
              - 172.64.0.0/13
              - 173.245.48.0/20
              - 188.114.96.0/20
              - 190.93.240.0/20
              - 197.234.240.0/22
              - 198.41.128.0/17
              # cloudflare-ips:end
              # prd VPC (nodes and pods). Pods now resolve the public hosts to
              # Cloudflare, but kube-proxy also filters in-cluster traffic to the LB
              # IP by this list, so pooled connections and stale answers from before
              # the BIND9 change keep working.
              - 10.6.0.0/15
