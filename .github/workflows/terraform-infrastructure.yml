name: Terraform Infrastructure [Deploy]

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, stg, prd, admin]
        default: dev
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options: [plan, apply]
        default: plan
      wireguard_envs:
        description: 'Admin project only: enabled environments (JSON array, e.g. ["dev"] or ["dev","stg"])'
        required: false
        type: string
        default: '["dev"]'

  push:
    branches: [main, 'v*']
    paths: ['terraform/infrastructure/**']

  pull_request:
    branches: [main, 'v*']
    paths: ['terraform/infrastructure/**']

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: '1.11.4'
  TF_STATE_BUCKET: 'rhesis-platform-admin-tfstate'

jobs:
  # workflow_dispatch plans exactly the one environment the user picked.
  # push/pull_request plan dev, stg, and prd unconditionally -- previously
  # only dev ever ran automatically, so a regression in stg/prd's Terraform
  # (e.g. the cloudflare provider gap this workflow's PR #2292 fixed) was
  # only ever caught by someone remembering to dispatch a manual plan.
  # wireguard/admin is intentionally excluded: it takes bespoke inputs
  # (wireguard_envs/wireguard_peers) that don't have sane defaults for an
  # automatic plan, and it changes far less often than dev/stg/prd.
  compute-matrix:
    name: Compute plan matrix
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set.outputs.environments }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'environments=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'environments=["dev","stg","prd"]' >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: Plan / ${{ matrix.environment }}
    needs: compute-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.compute-matrix.outputs.environments) }}
    # GitHub Actions job-level outputs from a matrix job only reliably
    # capture ONE matrix instance's value (in practice whichever completes
    # last) -- it does not merge/namespace per-environment values. This is
    # safe today only because `apply` (the sole consumer of target_env)
    # runs exclusively on workflow_dispatch, where compute-matrix always
    # produces a single-element array, so `plan` never actually runs as a
    # multi-instance matrix on the one path that reads this output. If
    # apply's trigger condition ever changes to also fire off a multi-env
    # plan (push/pull_request), this output stops being trustworthy and
    # needs to be reworked (e.g. a per-environment output via a fan-in
    # job, or dropping the shared output in favor of passing environment
    # through explicitly).
    outputs:
      target_env: ${{ steps.tf_setup.outputs.target_env }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tf-setup
        id: tf_setup
        with:
          environment: ${{ matrix.environment }}
          terraform_version: ${{ env.TF_VERSION }}
          wif_provider: ${{ secrets.WIF_PROVIDER }}
          tf_project_id_dev: ${{ secrets.TF_PROJECT_ID_DEV }}
          tf_project_id_stg: ${{ secrets.TF_PROJECT_ID_STG }}
          tf_project_id_prd: ${{ secrets.TF_PROJECT_ID_PRD }}
          tf_project_id_wireguard: ${{ secrets.TF_PROJECT_ID_WIREGUARD }}
          tf_sa_dev: ${{ secrets.TF_SA_DEV }}
          tf_sa_stg: ${{ secrets.TF_SA_STG }}
          tf_sa_prd: ${{ secrets.TF_SA_PRD }}
          tf_sa_wireguard: ${{ secrets.TF_SA_WIREGUARD }}

      - name: Init
        working-directory: terraform/infrastructure/envs/${{ steps.tf_setup.outputs.target_env }}
        run: terraform init -input=false -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Plan
        working-directory: terraform/infrastructure/envs/${{ steps.tf_setup.outputs.target_env }}
        run: terraform plan -input=false -out=tfplan -no-color 2>&1 | tee plan.txt
        env:
          TF_VAR_project_id: ${{ steps.tf_setup.outputs.project_id }}
          TF_VAR_region: ${{ secrets.TF_REGION }}
          TF_VAR_enabled_environments: ${{ inputs.environment == 'admin' && inputs.wireguard_envs || '[]' }}
          TF_VAR_wireguard_peers: ${{ inputs.environment == 'admin' && secrets.TF_WG_PEERS || '[]' }}

      # prd is excluded from auto-posted PR comments: now that prd plans
      # automatically on every PR (see compute-matrix above), pasting its
      # full plan output into a public/shared PR comment isn't something we
      # want by default (resource names, CIDRs, etc). Still runs and still
      # uploaded as an artifact below -- just not broadcast to the PR thread.
      - name: Post plan to PR
        if: github.event_name == 'pull_request' && steps.tf_setup.outputs.target_env != 'prd'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync(
              'terraform/infrastructure/envs/${{ steps.tf_setup.outputs.target_env }}/plan.txt',
              'utf8'
            );
            const body = raw.length > 65000 ? raw.slice(0, 65000) + '\n...(truncated)' : raw;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `<details><summary>Terraform Plan — <code>${{ steps.tf_setup.outputs.target_env }}</code></summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`
            });

      - uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ steps.tf_setup.outputs.target_env }}
          path: terraform/infrastructure/envs/${{ steps.tf_setup.outputs.target_env }}/tfplan
          retention-days: 1

  apply:
    name: Apply / ${{ needs.plan.outputs.target_env }}
    needs: plan
    runs-on: ubuntu-latest
    # Required reviewers are enforced via GitHub Environment protection rules in repo settings.
    # Configure "Required reviewers" on the following Environments:
    #   dev       → at least 1 reviewer (auto-applies on push to main; gate prevents unreviewed infra changes)
    #   stg       → at least 1 reviewer
    #   prd       → at least 1 reviewer
    #   wireguard → at least 1 reviewer (shown as "admin" in UI; VPN server; loss = all envs lose connectivity)
    #
    # WireGuard VM deletion protection is enabled in Terraform (wireguard_deletion_protection = true).
    # If Terraform needs to RECREATE the VM (rare), a human must first manually disable deletion
    # protection via gcloud, get it reviewed, then re-enable after apply:
    #   gcloud compute instances update wireguard-server \
    #     --no-deletion-protection --zone=**-***-a \
    #     --project=rhesis-p*******
    #
    # needs.plan.outputs.target_env is only trustworthy because this job's
    # own `if` below restricts it to workflow_dispatch -- see the comment
    # on plan's `outputs:` above for why a matrix job's output can't be
    # relied on in general.
    environment: ${{ needs.plan.outputs.target_env }}
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tf-setup
        id: tf_setup
        with:
          environment: ${{ inputs.environment }}
          terraform_version: ${{ env.TF_VERSION }}
          wif_provider: ${{ secrets.WIF_PROVIDER }}
          tf_project_id_dev: ${{ secrets.TF_PROJECT_ID_DEV }}
          tf_project_id_stg: ${{ secrets.TF_PROJECT_ID_STG }}
          tf_project_id_prd: ${{ secrets.TF_PROJECT_ID_PRD }}
          tf_project_id_wireguard: ${{ secrets.TF_PROJECT_ID_WIREGUARD }}
          tf_sa_dev: ${{ secrets.TF_SA_DEV }}
          tf_sa_stg: ${{ secrets.TF_SA_STG }}
          tf_sa_prd: ${{ secrets.TF_SA_PRD }}
          tf_sa_wireguard: ${{ secrets.TF_SA_WIREGUARD }}

      - uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ needs.plan.outputs.target_env }}
          path: terraform/infrastructure/envs/${{ needs.plan.outputs.target_env }}

      - name: Init
        working-directory: terraform/infrastructure/envs/${{ needs.plan.outputs.target_env }}
        run: terraform init -input=false -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Apply
        working-directory: terraform/infrastructure/envs/${{ needs.plan.outputs.target_env }}
        run: terraform apply -input=false tfplan
        env:
          TF_VAR_project_id: ${{ steps.tf_setup.outputs.project_id }}
          TF_VAR_region: ${{ secrets.TF_REGION }}
          TF_VAR_enabled_environments: ${{ needs.plan.outputs.target_env == 'wireguard' && inputs.wireguard_envs || '[]' }}
          TF_VAR_wireguard_peers: ${{ needs.plan.outputs.target_env == 'wireguard' && secrets.TF_WG_PEERS || '[]' }}
