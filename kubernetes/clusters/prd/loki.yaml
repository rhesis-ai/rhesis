apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/rhesis-ai/rhesis.git
    targetRevision: d90f5937d04fc03401af1ab39f0ed1868ebf51ed
    path: kubernetes/clusters/prd/loki
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
