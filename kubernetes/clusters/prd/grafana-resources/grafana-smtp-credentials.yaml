# Reuses the same GSM keys as external-secrets/rhesis-app-secrets.yaml (SMTP_HOST,
# SMTP_USER, SMTP_PASSWORD) so Grafana can send alert emails without a separate SMTP
# account. Synced separately into monitoring since a Secret can't be read across
# namespaces. Port isn't a secret (the app defaults SMTP_PORT to 587 and has no
# per-env override), so it's appended here rather than stored in GSM. FROM_EMAIL is
# deliberately not reused here: it's formatted for the app's email library
# (`"Display Name" <hello@rhesis.ai>`), which Grafana's from_address rejects — see
# GF_SMTP_FROM_ADDRESS in grafana-instance.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-smtp-credentials
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: grafana-smtp-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        host: "{{ .host }}:587"
        user: "{{ .user }}"
        password: "{{ .password }}"
  data:
    - secretKey: host
      remoteRef:
        key: prd-rhesis-smtp-host
    - secretKey: user
      remoteRef:
        key: prd-rhesis-smtp-user
    - secretKey: password
      remoteRef:
        key: prd-rhesis-smtp-password
